    </filter>
    <filter id="breakGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="icmpGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="endpointGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gradSource" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gradOk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gradWarn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradBreak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gradEndpoint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(30,58,95,.35)" stroke-width="1"/>
    </pattern>
  </defs>`;
}

function renderSingleTopo(data, updateBadge=true){
  const svg=document.getElementById('topoSvg');
  const paths=(data&&data.paths)||[];
  if(!paths.length){
    svg.setAttribute('viewBox','0 0 920 480');
    svg.innerHTML='<text x="460" y="240" fill="#64748b" text-anchor="middle" font-size="14">暂无路径数据</text>';
    clearTopoPending();
    if(updateBadge) updateRotateBadge(null,0);
    return;
  }
  if(!selectedTid||!paths.find(p=>p.tid===selectedTid)) selectedTid=paths[0].tid;
  const p=paths.find(x=>x.tid===selectedTid)||paths[0];
  const hops=p.hops||[];
  const summary=p.summary||{};
  const breakKind=summary.break_kind||'none';
  const breakHop=(summary.break_at&&summary.break_at.hop)||null;
  const routeDiff=getRouteCompareForPath(p);
  const pending=p.trace_status==='pending';
  document.getElementById('topoDetail').parentElement.classList.toggle('topo-pending',pending);

  const merged=!!p.target_merged;
  const nodes=[];
  nodes.push({kind:'source', status:'ok', label:'监控主机', hopNum:0});
  hops.forEach((h, idx)=>{
    const st=h.status||'ok';
    const isMarkPt=h.hop===breakHop&&breakKind!=='none';
    let tag='';
    let bk=null;
    if(isMarkPt&&breakKind==='real'){ tag='疑似断点'; bk='real'; }
    else if(isMarkPt&&breakKind==='icmp_filtered'){ tag='ICMP 盲区'; bk='icmp_filtered'; }
    else if(isMarkPt&&breakKind==='endpoint'){ tag='应用层异常'; bk='endpoint'; }
    else if(st==='filtered') tag='ICMP过滤';
    else if(st==='break'||st==='after') tag='无响应';
    const isMergedTarget=merged && idx===hops.length-1;
    const node={
      kind:isMergedTarget?'target':'hop', status:isMergedTarget?(p.status||'green'):st,
      hopNum:h.hop||'?',
      label:isMergedTarget?((p.label||'目标')+' · '+(p.resolve_ip||p.ip||'')):hopLabel(h),
      rtt:h.rtt_ms!=null?Number(h.rtt_ms).toFixed(1):null,
      tag,
      pulse:isMergedTarget?(p.status==='red'):(isMarkPt||st==='break'||st==='after'),
      breakPoint:isMarkPt,
      breakKind:bk,
    };
    nodes.push(node);
  });
  if(!merged){
    nodes.push({
      kind:'target', status:p.status||'green', pulse:p.status==='red',
      label:(p.label||'目标')+' · '+(p.ip||''),
    });
  }

  const layout=layoutSerpentine(nodes.length, 920, 480, 36);
  svg.setAttribute('viewBox',`0 0 ${layout.W} ${layout.totalH}`);

  let html=svgDefs();
  html+=`<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>`;
  const routeChanged=!!(p.route_changed||routeDiff);
  const pathBadge=`共 ${hops.length} 跳 · ${p.label||''}${routeChanged?' · 路径变化':''}`;
  const badgeMaxW=layout.W-24-(pending?160:0);
  html+=svgTopoBadge(pathBadge, 12, 8, badgeMaxW);
  if(pending){
    html+=`<rect x="760" y="8" width="148" height="28" rx="6" fill="rgba(120,53,15,.55)" stroke="rgba(245,158,11,.45)"/>`;
    html+=`<text x="834" y="27" fill="#fde68a" text-anchor="middle" font-size="11" font-weight="700">追踪进行中…</text>`;
  }

  for(let i=0;i<layout.pts.length-1;i++){
    const a=layout.pts[i], b=layout.pts[i+1];
    const nxt=nodes[i+1];
    const st=nxt.status||'ok';
    const isReal=nxt.breakKind==='real';
    const isIcmp=nxt.breakKind==='icmp_filtered';
    const isEp=nxt.breakKind==='endpoint';
    const col=isReal?'#ef4444':(isIcmp?'#f59e0b':(isEp?'#a78bfa':hopStatusColor(st)));
    const isHotEdge=isReal||isIcmp||isEp||st==='break'||st==='after';
    const dash=(st==='break'||st==='after'||pending)?' stroke-dasharray="6 4"':'';
    const cls='flow'+(isReal?' break-edge':(isIcmp?' icmp-edge':(pending?' pending-edge':'')));
    html+=`<path d="${topoEdgePath(a,b)}" fill="none" stroke="${col}" stroke-width="${isHotEdge?4.5:2.5}" opacity=".85"${dash} class="${cls}"/>`;
    html+=`<circle cx="${(a.x+b.x)/2}" cy="${(a.y+b.y)/2}" r="${isHotEdge?4:2.5}" fill="${col}" opacity=".95"/>`;
  }

  layout.pts.forEach((pt,i)=>{
    html+=renderHopNode(pt, nodes[i], layout);
  });

  svg.innerHTML=html;
  const poolInfo=getRotatePool(paths);
  const idx=Math.max(0,poolInfo.pool.findIndex(x=>x.tid===selectedTid));
  if(updateBadge) updateRotateBadge(poolInfo,idx);
  const tabs=paths.map(pp=>`<button class="winbtn${pp.tid===selectedTid?' active':''}" style="margin:0 4px 8px 0" onclick="selectPath('${escAttr(pp.tid)}')">${esc(pp.label)}</button>`).join('');
  const detail=(summary.text||'路径完整')+
    (pending?' · 追踪进行中（读缓存，不强制刷新）':'');
  let routeNote=routeDiff?renderRouteCompare(routeDiff):'';
  let breakNote='';
  if(breakHop&&breakKind==='real'){
    breakNote=`<div style="margin-top:6px;padding:8px 10px;border-radius:6px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fecaca;font-size:12px;font-weight:600">⚠ 疑似断点：第 ${breakHop} 跳${summary.break_at&&summary.break_at.ip?' · '+esc(summary.break_at.ip):''} — TCP 端口也不通</div>`;
  } else if(breakHop&&breakKind==='icmp_filtered'){
    let okHint='监测正常';
    const pt=(p.ping_type||'').toLowerCase();
    if(summary.service_ok&&pt==='dns') okHint='DNS 查询正常';
    else if(summary.service_ok&&(pt==='http'||pt==='https')) okHint='HTTP 监测正常';
    else {
      const ports=(p.tcp_checks||[]).filter(c=>c.success).map(c=>c.port).slice(0,4);
      if(ports.length) okHint=`${ports.join('/')} 端口检测正常`;
    }
    breakNote=`<div style="margin-top:6px;padding:8px 10px;border-radius:6px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.35);color:#bbf7d0;font-size:12px"><span style="font-weight:700;color:var(--green)">✓ ICMP 盲区（${esc(okHint)}）</span><br><span style="color:var(--dim);font-size:11px">traceroute 在第 ${breakHop} 跳后不可见，多为设备过滤 ICMP，不等于路径故障</span></div>`;
  } else if(breakHop&&breakKind==='endpoint'){
    breakNote=`<div style="margin-top:6px;padding:8px 10px;border-radius:6px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.35);color:#ddd6fe;font-size:12px"><span style="font-weight:700;color:#c4b5fd">◆ 应用层异常</span><br><span style="color:var(--dim);font-size:11px">第 ${breakHop} 跳后 ICMP 不可见，但故障原因在应用/DNS 层；路径拓扑仅供参考</span></div>`;
  }
  document.getElementById('topoDetail').innerHTML=tabs+
    routeNote+
    breakNote+
    `<div style="margin-top:6px">${esc(detail)}</div>`+
    `<div style="margin-top:4px;font-size:11px;color:var(--dim)">${merged
      ? `可视化 ${nodes.length} 个节点（源 + ${hops.length} 跳），最后一跳即监测目标`
      : `可视化 ${nodes.length} 个节点（源 + ${hops.length} 跳 + 监测目标），traceroute 未在最后一跳到达目标 IP`}</div>`;
  requestAnimationFrame(()=>markScrollable(document.getElementById('topoDetail')));
}

function selectPath(tid){
  focusPath(tid,{pauseMs:ROTATE.manualPauseMs,render:true});
}

async function refreshPaths(){
  try{
    const [paths,geo]=await Promise.all([api('paths'), api('geo')]);
    pathsData=paths;
    geoData=geo;
    renderTopo(pathsData);
    refreshRotateState(false);
    noteDataError({paths:paths, geo:geo});
  }catch(_){}
}

async function refreshOverviewAndTop(){
  try{
    const [ov,top]=await Promise.all([api('overview'), api('topn')]);
    renderOverview(ov);
    renderTop(top);
    noteDataError({overview:ov, topn:top});
  }catch(_){}
}

function renderTop(top){
  const sla=(top.lowest_sla||[]).slice(0,5);
  const lat=(top.highest_latency||[]).slice(0,5);
  const out=(top.most_outages||[]).slice(0,5);
  const maxLat=Math.max(1,...lat.map(r=>Number(r.lat_p95||r.lat_avg||0)));
  const maxOut=Math.max(1,...out.map(r=>Number(r.outage_seconds||0)));
  document.getElementById('topSla').innerHTML=sla.length?sla.map((r,i)=>{
    const pct=Math.max(0,Math.min(100,Number(r.uptime_pct)||0));
    return `<div class="toprow"><span class="top-rank">${i+1}</span><span class="top-name">${esc(r.label)}</span>`+
      `<div class="top-bar-wrap"><div class="top-bar" style="width:${pct}%"></div></div>`+
      `<span class="top-val">${r.uptime_pct!=null?r.uptime_pct.toFixed(2)+'%':'--'}</span></div>`;
  }).join('')
    :'<div style="color:var(--dim);font-size:12px;padding:8px">暂无</div>';
  document.getElementById('topLat').innerHTML=lat.length?lat.map((r,i)=>{
    const v=Number(r.lat_p95||r.lat_avg||0);
    const pct=Math.max(4,Math.min(100,(v/maxLat)*100));
    return `<div class="toprow"><span class="top-rank">${i+1}</span><span class="top-name">${esc(r.label)}</span>`+
      `<div class="top-bar-wrap"><div class="top-bar lat" style="width:${pct}%"></div></div>`+
      `<span class="top-val">${r.lat_p95!=null?r.lat_p95+' ms':(r.lat_avg!=null?r.lat_avg+' ms':'--')}</span></div>`;
  }).join('')
    :'<div style="color:var(--dim);font-size:12px;padding:8px">暂无</div>';
  document.getElementById('topOutages').innerHTML=out.length?out.map((r,i)=>{
    const sec=Number(r.outage_seconds||0);
    const cnt=Number(r.outage_count||0);
    const pct=Math.max(4,Math.min(100,(sec/maxOut)*100));
    return `<div class="toprow"><span class="top-rank">${i+1}</span><span class="top-name">${esc(r.label)}</span>`+
      `<div class="top-bar-wrap"><div class="top-bar outage" style="width:${pct}%"></div></div>`+
      `<span class="top-val">${cnt}次 · ${formatDur(sec)}</span></div>`;
  }).join('')
    :'<div style="color:var(--dim);font-size:12px;padding:8px">暂无</div>';
}

function renderEvents(ev){
  const rows=(ev&&ev.events)||ev||[];
  document.getElementById('eventLine').innerHTML=rows.length?rows.map(r=>{
    const cls=eventRowClass(r);
    const tag=EVENT_TYPE_LABEL[r.type]||'';
    const etype=tag?`<span class="etype">${esc(tag)}</span>`:'';
    return `<div class="trow ${cls}"><span>${esc(r.time||'--')}</span><span>${esc(r.label||'')}</span><span>${esc(r.text||'')}${etype}</span></div>`;
  }).join(''):'<div style="color:var(--dim);font-size:12px">暂无事件</div>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function escAttr(s){return esc(s).replace(/'/g,'&#39;');}

function toggleFs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

function connectSSE(){
  if(DEMO) return;
  const es=new EventSource('/events');
  let debAll=null, debPaths=null;
  es.onmessage=e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.type==='heartbeat') return;
      if(m.type==='trace_break'){
        clearTimeout(debPaths);
        debPaths=setTimeout(()=>{
          refreshPaths().then(()=>onTraceFaultSSE(m));
          refreshOverviewAndTop();
        },400);
        return;
      }
      if(m.type==='trace_heal'){
        clearTimeout(debPaths);
        debPaths=setTimeout(()=>{
          refreshPaths().then(()=>onTraceHealSSE(m));
          refreshOverviewAndTop();
          api('events').then(renderEvents).catch(()=>{});
        },400);
        return;
      }
      if(m.type==='route_changed'){
        clearTimeout(debPaths);
        debPaths=setTimeout(()=>{
          refreshPaths().then(()=>onRouteChangedSSE(m));
          refreshOverviewAndTop();
          api('events').then(renderEvents).catch(()=>{});
        },400);
        return;
      }
      if(m.type==='update'&&m.target&&topoMode==='single'){
        const st=m.target.status;
        if(st==='red'||st==='orange') onTraceFaultSSE(m.target);
      }
      clearTimeout(debAll);
      debAll=setTimeout(loadAll,1200);
    }catch(_){}
  };
  es.onerror=()=>{es.close(); setTimeout(connectSSE,5000);};
}
connectSSE();
initExplainBanner();
syncCenterPanelMode();
loadAll();
requestAnimationFrame(()=>markScrollable());
refreshTimer=setInterval(loadAll,15000);

    '<path d="M2 26V10c0-5 2.5-8 8-8h18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'+
    '<circle cx="8" cy="8" r="2" fill="currentColor" opacity=".9"/>'+
    '<path d="M2 26h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".5"/></svg>';
  document.querySelectorAll('.panel:not(.topbar)').forEach(p=>{
    if(p.querySelector('.corner')) return;
    ['c-tl','c-tr','c-bl','c-br'].forEach(cls=>{
      const d=document.createElement('div');
      d.className='corner '+cls;
      d.innerHTML=svg;
      p.appendChild(d);
    });
  });
})();
