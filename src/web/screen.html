/* ───────── 3D globe (globe.gl) — lazy-loaded twin of the 2D geo map ─────────
   Reuses the same geoData (source + targets + break points) and the same status
   palette (colorForStatus / cyan source) as the 2D map, so 2D and 3D stay
   visually consistent. All assets live under /vendor/ (no CDN) and are bundled
   into the exe by the spec's ('src/web/vendor', ...) datas entry. The library is
   loaded on first activation only, so 2D-only users pay nothing for it. */
function hasWebGL(){
  try{const c=document.createElement('canvas');
    return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));
  }catch(e){return false;}
}
function ensureGlobeLib(){
  if(globeLibPromise) return globeLibPromise;
  globeLibPromise=new Promise((resolve,reject)=>{
    if(window.Globe) return resolve();
    const s=document.createElement('script');
    s.src='/vendor/globe.gl.min.js'; s.async=true;
    s.onload=()=>window.Globe?resolve():reject(new Error('Globe 未定义'));
    s.onerror=()=>reject(new Error('globe.gl 加载失败'));
    document.head.appendChild(s);
  }).catch(err=>{globeLibPromise=null; throw err;});
  return globeLibPromise;
}
/* Pause gentle auto-rotate for a while (hover leave / drag / node click), then resume. */
function globePauseRotate(ms){
  if(!globe) return;
  globe.controls().autoRotate=false;
  clearTimeout(globe.__rotTimer);
  globe.__rotTimer=setTimeout(()=>{
    if(globe&&geo3D&&topoMode==='geo'&&!globeHoverPoly) globe.controls().autoRotate=true;
  }, ms||6000);
}
function globeClearPolyHover(){
  if(!globeHoverPoly) return;
  globeHoverPoly=null;
  if(globe) applyGlobePolygonStyle();
}
function initGlobe(){
  if(globe) return globe;
  const el=document.getElementById('globeViz');
  globe=Globe()(el)
    .backgroundImageUrl('/vendor/night-sky.png')
    .showAtmosphere(true).atmosphereColor('#38e0ff').atmosphereAltitude(0.26)
    .pointLat('lat').pointLng('lng').pointColor('color')
      .pointAltitude('alt').pointRadius('r').pointsMerge(false)
    .onPointClick(d=>onGlobePointClick(d))
    .htmlLat('lat').htmlLng('lng').htmlAltitude('halt')
      .htmlElement(d=>{const e=document.createElement('div');e.className='glb-tag';
        e.textContent=d.name; e.style.borderColor=d.color+'aa';
        if(d.tid){ e.classList.add('glb-clickable'); e.title='点击查看节点详情';
          e.addEventListener('click',ev=>{ev.stopPropagation(); onGlobePointClick(d);}); }
        return e;})
    .arcStartLat('a').arcStartLng('b').arcEndLat('c').arcEndLng('d').arcColor('color')
      .arcStroke(0.55).arcAltitudeAutoScale(0.45)
      .arcDashLength(0.45).arcDashGap(0.25).arcDashInitialGap(()=>Math.random()).arcDashAnimateTime(1600)
    .ringLat('lat').ringLng('lng')
      .ringColor(()=>(t=>'rgba(239,68,68,'+(1-t)+')'))
      .ringMaxRadius(6).ringPropagationSpeed(2.4).ringRepeatPeriod(700)
    .polygonsTransitionDuration(0)
    .polygonCapColor(d=>globePolyCapColor(d===globeHoverPoly))
    .polygonSideColor(()=>globePolySideColor())
    .polygonStrokeColor(()=>globePolyStrokeColor())
    .polygonAltitude(globePolyAltitude)
    .polygonLabel(d=>{const n=cnCountry((d.properties||{}).name);
      return n?`<div style="font:600 12px/1.3 'Segoe UI','Microsoft YaHei',sans-serif;color:#bae6fd;background:rgba(8,16,32,.85);border:1px solid rgba(56,224,255,.5);border-radius:3px;padding:2px 8px">${esc(n)}</div>`:'';})
    .onPolygonHover(d=>onGlobePolyHover(d));
  try{globe.renderer().setClearColor(0x030712,1);}catch(e){}
  try{globe.renderer().logarithmicDepthBuffer=true;}catch(e){}
  // Cap render resolution: DPR ≤ 2 is untouched (identical quality on normal,
  // retina and standard 4K@100% screens); only extreme high-DPI (>2, e.g. 5K/8K
  // or 4K at high OS scaling) is clamped to 2 to avoid runaway GPU on a 24/7
  // screen. No visible change for the vast majority of displays.
  try{globe.renderer().setPixelRatio(Math.min(window.devicePixelRatio||1, 2));}catch(e){}
  // Recover gracefully if the GPU drops the WebGL context (driver reset, etc.):
  // dormant in normal use; only fires on an actual context loss, which would
  // otherwise leave the globe permanently blank.
  try{const gcv=globe.renderer().domElement;
    gcv.addEventListener('webglcontextlost',e=>e.preventDefault(),false);
    gcv.addEventListener('webglcontextrestored',()=>{try{applyGlobeStyle(globeStyle);
      if(geoData) renderGlobe(geoData,false);}catch(_){}},false);
  }catch(e){}
  const c=globe.controls(); c.autoRotate=true; c.autoRotateSpeed=0.6;
  c.enableZoom=true; c.minDistance=180; c.maxDistance=620;
  try{ c.addEventListener('start',()=>{ globeClearPolyHover(); globePauseRotate(12000); }); }catch(e){}
  try{ c.addEventListener('end',()=>onGlobeCameraEnd()); }catch(e){}
  // onPolygonHover doesn't fire when the cursor leaves the canvas entirely —
  // clear the hover (and resume rotation) when the mouse exits the globe area.
  try{ el.addEventListener('mouseleave',()=>onGlobePolyHover(null)); }catch(e){}
  loadGlobeCountries();
  setupGlobeSearch();
  applyGlobeStyle(globeStyle);
  globeReady=true;
  return globe;
}
/* Style switch: 写实(真实地表) ⇄ 城市灯光(夜灯+发光国界线). No grid in either. */
function applyGlobeStyle(style){
  globeStyle=(style==='real')?'real':'night';
  try{localStorage.setItem('screenGlobeStyle',globeStyle);}catch(e){}
  const bn=document.getElementById('btnGlobeNight'), br=document.getElementById('btnGlobeReal');
  if(bn) bn.classList.toggle('active',globeStyle==='night');
  if(br) br.classList.toggle('active',globeStyle==='real');
  if(!globe) return;
  if(globeStyle==='real'){
    globe.globeImageUrl('/vendor/earth-blue-marble.jpg').bumpImageUrl('/vendor/earth-topology.png');
  }else{
    globe.globeImageUrl('/vendor/earth-night.jpg'); try{globe.bumpImageUrl(null);}catch(e){}
  }
  // Country borders visible only in 城市灯光; both styles keep the polygon layer
  // so hover-highlight + country name work either way (写实 just hides the stroke).
  applyGlobePolygonStyle();
}
function setGlobeStyle(style, btn){ applyGlobeStyle(style); }
/* Country polygons (Natural Earth 50m) — borders + hover-highlight + country name.
   Uses ne_countries.json (cleaned 50m dataset); the ECharts world.json crashes the
   globe.gl polygon layer (degenerate rings -> d3-geo). Loaded once for both styles. */
function loadGlobeCountries(){
  if(!globe) return;
  if(globeBordersData){ globe.polygonsData(globeBordersData); return; }
  fetch('/vendor/ne_countries.json?v=3').then(r=>r.ok?r.json():null).then(j=>{
    if(!j) return;
    globeBordersData=(j.features||[]).filter(f=>f&&f.geometry);
    if(globe) globe.polygonsData(globeBordersData);
  }).catch(()=>{});
}
/* Hover a country: highlight + name + pause auto-rotate; leaving schedules resume
   after GLOBE_HOVER_ROTATE_DELAY_MS so small countries stay readable. */
function onGlobePolyHover(d){
  const next=d||null;
  if(next===globeHoverPoly) return;
  globeHoverPoly=next;
  if(!globe) return;
  applyGlobePolygonStyle();
  if(next){
    clearTimeout(globe.__rotTimer);
    globe.controls().autoRotate=false;
  }else{
    globePauseRotate(GLOBE_HOVER_ROTATE_DELAY_MS);
  }
}
/* Click a node: fly close (spreads nearby nodes), select it, link the detail panel. */
function onGlobePointClick(d){
  if(!d||!globe) return;
  globeClearPolyHover();
  globePauseRotate(8000); globeZoomIn=true;
  globe.pointOfView({lat:d.lat,lng:d.lng,altitude:1.25}, 800);
  if(d.tid){ selectedTid=d.tid; showGlobeNodeDetail(d.tid); }
  if(geoData) renderGlobe(geoData,false);
}
/* When the camera settles, reveal all labels if zoomed in, declutter when far. */
function onGlobeCameraEnd(){
  if(!globe||!geo3D) return;
  const alt=(globe.pointOfView()||{}).altitude;
  const zoomed=(alt!=null&&alt<1.8);
  if(zoomed!==globeZoomIn){ globeZoomIn=zoomed; if(geoData) renderGlobe(geoData,false); }
}
/* ---- Globe search / jump: locate a node or country without hunting for a tiny
   hit target on a spinning sphere. Type -> Enter (or click a result) flies the
   camera there; nodes select + open detail, countries highlight + center. ---- */
function globeFeatureCentroid(f){
  if(f.__cen) return f.__cen;
  const g=f&&f.geometry; if(!g) return null;
  const polys=g.type==='Polygon'?[g.coordinates]:(g.type==='MultiPolygon'?g.coordinates:[]);
  // Center on the largest landmass (outer ring by |shoelace area|) so multi-part
  // countries (US, Russia, Japan) target their main body, not an island average.
  let best=null, bestA=-1;
  for(let i=0;i<polys.length;i++){
    const ring=polys[i]&&polys[i][0]; if(!ring||ring.length<4) continue;
    let a=0; for(let k=0;k<ring.length-1;k++){ a+=ring[k][0]*ring[k+1][1]-ring[k+1][0]*ring[k][1]; }
    a=Math.abs(a); if(a>bestA){ bestA=a; best=ring; }
  }
  if(!best) return null;
  // Spherical (3D unit-vector) average handles ±180° wrap (Russia, Fiji, NZ).
  let x=0,y=0,z=0; const n=best.length;
  for(let k=0;k<n;k++){ const lo=best[k][0]*Math.PI/180, la=best[k][1]*Math.PI/180;
    x+=Math.cos(la)*Math.cos(lo); y+=Math.cos(la)*Math.sin(lo); z+=Math.sin(la); }
  if(!n) return null;
  x/=n; y/=n; z/=n;
  const lng=Math.atan2(y,x)*180/Math.PI;
  const lat=Math.atan2(z,Math.sqrt(x*x+y*y))*180/Math.PI;
  return (f.__cen={lat,lng});
}
function globeJumpToNode(tid){
  const t=((geoData&&geoData.targets)||[]).find(x=>x.tid===tid);
  if(!t||!t.geo||t.geo.lat==null||t.geo.lon==null) return;
  onGlobePointClick({lat:t.geo.lat,lng:t.geo.lon,tid:t.tid,name:t.label||t.tid,color:colorForStatus(t.status)});
}
function globeJumpToCountry(f){
  if(!globe||!f) return;
  const c=globeFeatureCentroid(f); if(!c) return;
  globeHoverPoly=f; applyGlobePolygonStyle();
  globe.controls().autoRotate=false;
  clearTimeout(globe.__rotTimer);
  globe.__rotTimer=setTimeout(()=>{ globeClearPolyHover();
    if(globe&&geo3D&&topoMode==='geo') globe.controls().autoRotate=true; }, 9000);
  globe.pointOfView({lat:c.lat,lng:c.lng,altitude:1.55}, 900);
  const nm=cnCountry((f.properties||{}).name), d=document.getElementById('topoDetail');
  if(d&&nm) d.innerHTML=`<div><span style="color:var(--cyan)">◎ 已定位</span> · ${esc(nm)}`+
    `<span style="margin-left:8px;font-size:11px;color:var(--dim)">拖拽旋转 / 点击节点查看详情</span></div>`;
}
function globeSearchMatch(){
  const q=((document.getElementById('globeSearchInput')||{}).value||'').trim().toLowerCase();
  const nodes=[], countries=[];
  if(q){
    ((geoData&&geoData.targets)||[]).forEach(t=>{
      if(!t.geo||t.geo.lat==null||t.geo.lon==null) return;
      const hay=((t.label||'')+' '+(t.tid||'')+' '+(t.ip||t.host||'')).toLowerCase();
      if(hay.indexOf(q)>=0) nodes.push(t);
    });
    (globeBordersData||[]).forEach(f=>{
      const en=((f.properties||{}).name)||'', cn=cnCountry(en);
      if(en.toLowerCase().indexOf(q)>=0 || (cn&&cn.toLowerCase().indexOf(q)>=0)) countries.push({f,en,cn});
    });
  }
  return {q, nodes:nodes.slice(0,8), countries:countries.slice(0,8)};
}
function globeRenderSearch(){
  const box=document.getElementById('globeSearchResults'); if(!box) return;
  const {q,nodes,countries}=globeSearchMatch();
  globeSearchItems=[];
  if(!q){ box.classList.add('hidden'); box.innerHTML=''; globeSearchSel=-1; return; }
  let html='';
  if(nodes.length){ html+='<div class="gs-group">节点</div>';
    nodes.forEach(t=>{ const i=globeSearchItems.length; globeSearchItems.push({type:'node',t});
      const col=colorForStatus(t.status);
      html+=`<div class="gs-row" data-i="${i}" onmousedown="event.preventDefault();globeSearchPick(${i})">`+
            `<span class="gs-dot" style="background:${col};box-shadow:0 0 6px ${col}"></span>${esc(t.label||t.tid)}</div>`;
    });
  }
  if(countries.length){ html+='<div class="gs-group">国家 / 地区</div>';
    countries.forEach(c=>{ const i=globeSearchItems.length; globeSearchItems.push({type:'country',f:c.f});
      html+=`<div class="gs-row" data-i="${i}" onmousedown="event.preventDefault();globeSearchPick(${i})">`+
            `<span class="gs-flag">🌐</span>${esc(c.cn||c.en)}`+
            `<span class="gs-sub">${esc(c.cn?c.en:'')}</span></div>`;
    });
  }
  if(!globeSearchItems.length) html='<div class="gs-empty">无匹配结果</div>';
  box.innerHTML=html; box.classList.remove('hidden');
  globeSearchSel=globeSearchItems.length?0:-1; globeUpdateSearchSel();
}
function globeUpdateSearchSel(){
  const box=document.getElementById('globeSearchResults'); if(!box) return;
  box.querySelectorAll('.gs-row').forEach(r=>r.classList.toggle('active',+r.getAttribute('data-i')===globeSearchSel));
  const a=box.querySelector('.gs-row.active'); if(a&&a.scrollIntoView) a.scrollIntoView({block:'nearest'});
}
function globeHideSearch(){
  const b=document.getElementById('globeSearchResults');
  if(b){ b.classList.add('hidden'); b.innerHTML=''; }
  globeSearchItems=[]; globeSearchSel=-1;
}
function globeSearchPick(i){
  const it=globeSearchItems[i];
  if(it){ if(it.type==='node') globeJumpToNode(it.t.tid); else globeJumpToCountry(it.f); }
  const inp=document.getElementById('globeSearchInput'); if(inp){ inp.value=''; inp.blur(); }
  globeHideSearch();
}
function globeSearchKey(e){
  if(e.isComposing) return;   // don't hijack Enter while composing pinyin/IME
  const n=globeSearchItems.length;
  if(e.key==='ArrowDown'){ if(n){ globeSearchSel=(globeSearchSel+1)%n; globeUpdateSearchSel(); } e.preventDefault(); }
  else if(e.key==='ArrowUp'){ if(n){ globeSearchSel=(globeSearchSel-1+n)%n; globeUpdateSearchSel(); } e.preventDefault(); }
  else if(e.key==='Enter'){ if(n) globeSearchPick(globeSearchSel>=0?globeSearchSel:0); e.preventDefault(); }
  else if(e.key==='Escape'){ const i=document.getElementById('globeSearchInput'); if(i){ i.value=''; i.blur(); } globeHideSearch(); }
}
function setupGlobeSearch(){
  const inp=document.getElementById('globeSearchInput'); if(!inp||inp.__wired) return;
  inp.__wired=true;
  inp.addEventListener('input', globeRenderSearch);
  inp.addEventListener('focus', ()=>{ if(inp.value.trim()) globeRenderSearch(); });
  inp.addEventListener('keydown', globeSearchKey);
  document.addEventListener('mousedown', e=>{ const w=document.getElementById('globeSearch');
    if(w && !w.contains(e.target)) globeHideSearch(); });
}
function showGlobeNodeDetail(tid){
  const t=((geoData&&geoData.targets)||[]).find(x=>x.tid===tid);
  const d=document.getElementById('topoDetail'); if(!t||!d) return;
  globeDetailTid=tid;
  const col=colorForStatus(t.status);
  const stTxt=t.status==='red'?'告警':(t.status==='orange'?'警告':(t.status==='green'?'正常':'—'));
  const loc=(typeof geoPlaceLabel==='function'&&t.geo)?geoPlaceLabel(t.geo):'';
  d.innerHTML=`<div><span style="color:${col};font-weight:700">●</span> ${esc(t.label||tid)} · `+
    `<span style="color:${col}">${stTxt}</span>${loc?' · '+esc(loc):''}</div>`+
    `<div style="margin-top:6px"><button class="winbtn" onclick="drillGlobeDetail()">查看完整链路 →</button>`+
    `<span style="margin-left:8px;font-size:11px;color:var(--dim)">点「全貌」回到全球</span></div>`;
  requestAnimationFrame(()=>markScrollable(d));
}
function renderGlobeMapSummary(data, opts){
  const d=document.getElementById('topoDetail'); if(!d) return;
  const targets=(data&&data.targets)||[];
  const src=(data&&data.source)||null;
  const mappable=targets.filter(t=>t.geo&&t.geo.lon!=null&&t.geo.lat!=null);
  const srcHint=src
    ? (' · 弧线源 '+esc(monitorSourceLabel(src))+
       (src.loc_source==='egress_ip'?'（公网出口）':
        src.loc_source==='local_ip'?'（本机公网）':''))
    : (' · 监控源未定位（内网需能访问外网查出口 IP，或手动填写；并确认 assets/ip2region_v4.xdb 已下载）');
  const notice=opts&&opts.notice
    ? `<div style="margin-bottom:6px;color:var(--orange)">${esc(opts.notice)}</div>`:'';
  d.innerHTML=notice+
    `<div>3D 地球 — 可上图 ${mappable.length} 个${srcHint}</div>`+
    `<div style="margin-top:4px;font-size:11px;color:var(--dim)">点击节点查看详情；拖拽旋转 / 滚轮缩放；点「全貌」恢复默认视角</div>`;
  requestAnimationFrame(()=>markScrollable(d));
}
function syncGlobeDetailState(data){
  if(!globeDetailTid) return;
  if(((data&&data.targets)||[]).some(t=>t.tid===globeDetailTid)) return;
  globeDetailTid=null;
  renderGlobeMapSummary(data);
}
/* Drill from the globe node detail into the full single-path tracert view.
   Reuses the existing 2D drill (drillToSinglePath) — switches to 单路径 and
   focuses the node; returning to 地理视图 restores the globe (geo3D persists). */
function drillGlobeDetail(){
  const tid=globeDetailTid;
  if(!tid) return;
  const targets=(geoData&&geoData.targets)||[];
  const paths=(pathsData&&pathsData.paths)||[];
  if(!targets.some(t=>t.tid===tid)||!paths.some(p=>p.tid===tid)){
    globeDetailTid=null;
    renderGlobeMapSummary(geoData,{notice:'目标已不存在或已刷新，请重新选择节点。'});
    return;
  }
  drillToSinglePath(tid);
}
function globeCameraFor(){
  if(geoMapUserChoice==='china') return {lat:34,lng:104,altitude:1.62};
  if(geoMapUserChoice==='world') return {lat:10,lng:60,altitude:2.0};
  return {lat:22,lng:108,altitude:2.0};
}
function renderGlobe(data, updateBadge=true){
  const el=document.getElementById('globeViz');
  if(!el) return;
  if(!hasWebGL()){ geo3D=false; syncGlobeVisibility(); renderGeo(data,updateBadge); return; }
  ensureGlobeLib().then(()=>{
    if(!geo3D||topoMode!=='geo') return;
    const g=initGlobe();
    ensureSelectedTidValid();
    const targets=(data&&data.targets)||[];
    const src=(data&&data.source)||null;
    const hasSrc=src&&src.lon!=null&&src.lat!=null;
    const mappable=targets.filter(t=>t.geo&&t.geo.lon!=null&&t.geo.lat!=null);
    const pts=[], arcs=[], rings=[], labelPts=[];
    if(hasSrc){ const sp={lat:src.lat,lng:src.lon,name:monitorSourceLabel(src),
                          color:'#22d3ee',alt:0.06,halt:0.085,r:0.62};
      pts.push(sp); labelPts.push(sp); }   // monitor source always labeled
    mappable.forEach(t=>{
      const col=colorForStatus(t.status), sel=t.tid===selectedTid;
      const pt={lat:t.geo.lat,lng:t.geo.lon,name:t.label||t.tid,color:col,tid:t.tid,
                alt:sel?0.06:0.035,halt:sel?0.085:0.05,r:sel?0.56:0.4};
      pts.push(pt);
      // declutter: only the selected node + fault(red) nodes are labeled when
      // viewing the whole globe; flying in (globeZoomIn) reveals every label.
      if(globeZoomIn||sel||t.status==='red') labelPts.push(pt);
      if(hasSrc) arcs.push({a:src.lat,b:src.lon,c:t.geo.lat,d:t.geo.lon,color:['#22d3ee',col]});
      if(t.status==='red') rings.push({lat:t.geo.lat,lng:t.geo.lon});
    });
    const dynSig=globeDynamicSig(pts, labelPts, arcs, rings);
    if(g.__dynSig!==dynSig){
      g.__dynSig=dynSig;
      g.pointsData(pts).htmlElementsData(labelPts).arcsData(arcs).ringsData(rings);
    }
    // Resize only when the container size actually changed (e.g. first show).
    // Calling width()/height() every refresh re-renders the whole scene and made
    // the borders visibly blink on each rotation/poll tick.
    requestAnimationFrame(()=>{try{const cw=el.clientWidth, ch=el.clientHeight;
      if(cw&&ch&&(g.__lw!==cw||g.__lh!==ch)){ g.__lw=cw; g.__lh=ch; g.width(cw); g.height(ch); }
    }catch(e){}});
    syncGlobeDetailState(data);
    // NOTE: do NOT move the camera on data refresh — periodic loadAll/SSE renders
    // would otherwise yank the globe back to the preset every cycle and the
    // gentle auto-rotation would appear to "stop". Camera moves only on explicit
    // user actions (地球 toggle, china/world/全貌 presets, node click).
  }).catch(err=>{
    const d=document.getElementById('topoDetail');
    if(d) d.textContent='3D 地球加载失败：'+err.message+'（已回退 2D 地图）';
    geo3D=false; syncGlobeVisibility(); renderGeo(data,updateBadge);
  });
}
function syncGlobeVisibility(){
  const on=(topoMode==='geo'&&geo3D);
  document.getElementById('centerPanel').classList.toggle('globe-on',on);
  const b=document.getElementById('btnGlobe'); if(b) b.classList.toggle('active',geo3D);
  if(!on) globeHideSearch();
  if(globe){ if(on){ if(globe.resumeAnimation) globe.resumeAnimation(); }
             else  { if(globe.pauseAnimation)  globe.pauseAnimation();  } }
}
// Pause the globe's render loop while the page is hidden (minimised/occluded) to
// save GPU on a 24/7 screen. Data polling (loadAll/SSE) is separate and keeps
// running, so the view is current when the page becomes visible again.
document.addEventListener('visibilitychange',()=>{
  if(!globe) return;
  if(document.hidden){ if(globe.pauseAnimation) globe.pauseAnimation(); }
  else if(topoMode==='geo'&&geo3D){ if(globe.resumeAnimation) globe.resumeAnimation(); }
});
function toggleGlobe(btn){
  if(!geo3D&&!hasWebGL()){
    const d=document.getElementById('topoDetail');
    if(d) d.textContent='当前环境不支持 WebGL，无法启用 3D 地球';
    return;
  }
  geo3D=!geo3D;
  if(geo3D&&topoMode!=='geo') setTopoMode('geo', document.getElementById('btnTopoGeo'));
  syncGlobeVisibility();
  if(geoData) renderGeo(geoData,true);
  // one-time entrance fly to the current preset (renderGlobe no longer moves the camera)
  if(geo3D) ensureGlobeLib().then(()=>{ if(geo3D&&globe) globe.pointOfView(globeCameraFor(), 900); }).catch(()=>{});
}

function renderTopo(data){
  if(topoMode!=='single') clearTopoPending();
  if(topoMode==='geo'){
    renderGeo(geoData||{targets:[]});
    return;
  }
  if(topoMode==='merged'){
    renderMergedTopo(data);
    return;
  }
  renderSingleTopo(data);
}

function renderMergedTopo(data){
  const svg=document.getElementById('topoSvg');
  const merged=(data&&data.merged)||{};
  const order=merged.node_order||[];
  const nodesById={};
  (merged.nodes||[]).forEach(n=>{nodesById[n.id]=n;});
  if(!order.length){
    svg.setAttribute('viewBox','0 0 920 480');
    svg.innerHTML='<text x="460" y="240" fill="#64748b" text-anchor="middle" font-size="14">暂无合并拓扑数据</text>';
    return;
  }
  const visuals=[];
  order.forEach(nid=>{
    const n=nodesById[nid]||{id:nid};
    if(nid==='source'){
      visuals.push({kind:'source', status:'ok', label:n.label||'监控主机', hopNum:0});
    } else if(n.is_target){
      visuals.push({
        kind:'target', status:n.target_status||n.status||'green', pulse:(n.target_status||n.status)==='red',
        label:(n.target_label||n.label||'')+(n.ip?(' · '+n.ip):''),
      });
    } else if(n.type==='target'){
      visuals.push({
        kind:'target', status:n.status||'green', pulse:n.status==='red',
        label:(n.label||n.tid||'')+(n.tid?(' · '+n.tid):''),
      });
    } else {
      const st=n.status||'ok';
      let tag='';
      const share=(n.target_tids||[]).length;
      if(share>1) tag=share+' 路共用';
      else if(st==='break'||st==='after') tag='疑似断点';
      else if(st==='filtered') tag='ICMP过滤';
      visuals.push({
        kind:'hop', status:st, hopNum:(n.label||'').replace(/^Hop\s*/,'')||'?',
        label:(n.ip&&n.ip!=='*')?n.ip:'未知',
        rtt:n.rtt_ms!=null?Number(n.rtt_ms).toFixed(1):null,
        tag, pulse:st==='break'||st==='after',
        breakPoint:st==='break'||st==='after',
      });
    }
  });
  const layout=layoutSerpentine(visuals.length, 920, 480, 36);
  svg.setAttribute('viewBox',`0 0 ${layout.W} ${layout.totalH}`);
  const pos={};
  order.forEach((nid,i)=>{pos[nid]=layout.pts[i];});
  let html=svgDefs();
  html+=`<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>`;
  const mergeBadge=`合并 ${merged.path_count||0} 条 · 共用跳 ${merged.shared_hops||0}`;
  html+=svgTopoBadge(mergeBadge, 12, 8, layout.W-24);
  (merged.edges||[]).forEach(e=>{
    const a=pos[e.from], b=pos[e.to];
    if(!a||!b) return;
    const col=hopStatusColor(e.status||'ok');
    const isBreak=e.status==='break'||e.status==='after'||e.status==='red';
    html+=topoFlowEdge(a, b, isBreak, col, 4, 'flow break-edge');
  });
  layout.pts.forEach((pt,i)=>{html+=renderHopNode(pt, visuals[i], layout);});
  svg.innerHTML=html;
  document.getElementById('topoDetail').innerHTML=
    `<div>多目标路径合并视图 — 相同 IP 的跳点合并为一个节点</div>`+
    `<div style="margin-top:4px;font-size:11px;color:var(--dim)">共 ${visuals.length} 个节点 · ${(merged.edges||[]).length} 条边</div>`;
  requestAnimationFrame(()=>markScrollable(document.getElementById('topoDetail')));
}

function estimateSvgTextWidth(text, fontSize=12){
  let w=0;
  for(const ch of String(text)){
    w += ch.charCodeAt(0)>255 ? fontSize : fontSize*0.58;
  }
  return w;
}

function svgTopoBadge(text, x, y, maxWidth, {fs=12, minW=48, h=28, pad=24}={}){
  let label=String(text||'');
  const innerMax=Math.max(minW, maxWidth)-pad;
  if(estimateSvgTextWidth(label, fs)>innerMax){
    while(label.length>1&&estimateSvgTextWidth(label+'…', fs)>innerMax){
      label=label.slice(0,-1);
    }
    label+='…';
  }
  const contentW=estimateSvgTextWidth(label, fs)+pad;
  const w=Math.min(maxWidth, Math.max(minW, contentW));
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="rgba(15,23,42,.75)" stroke="rgba(34,211,238,.3)"/>`+
    `<text x="${x+12}" y="${y+19}" fill="#22d3ee" font-size="${fs}" font-weight="600">${esc(label)}</text>`;
}

function svgDefs(){
  return `<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="breakGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="icmpGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="endpointGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gradSource" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gradOk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gradWarn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradBreak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gradEndpoint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradFlow" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(30,58,95,.35)" stroke-width="1"/>
    </pattern>
  </defs>`;
}

function renderSingleTopo(data, updateBadge=true){
  const svg=document.getElementById('topoSvg');
  const paths=(data&&data.paths)||[];
  if(!paths.length){
    svg.setAttribute('viewBox','0 0 920 480');
    svg.innerHTML='<text x="460" y="240" fill="#64748b" text-anchor="middle" font-size="14">暂无路径数据</text>';
    clearTopoPending();
    if(updateBadge) updateRotateBadge(null,0);
    return;
  }
  if(!selectedTid||!paths.find(p=>p.tid===selectedTid)) selectedTid=paths[0].tid;
  const p=paths.find(x=>x.tid===selectedTid)||paths[0];
  const hops=p.hops||[];
  const summary=p.summary||{};
  const breakKind=summary.break_kind||'none';
  const breakHop=(summary.break_at&&summary.break_at.hop)||null;
  const routeDiff=getRouteCompareForPath(p);
  const pending=p.trace_status==='pending';
  document.getElementById('topoDetail').parentElement.classList.toggle('topo-pending',pending);

  const merged=!!p.target_merged;
  const nodes=[];
  nodes.push({kind:'source', status:'ok', label:'监控主机', hopNum:0});
  hops.forEach((h, idx)=>{
    const st=h.status||'ok';
    const isMarkPt=h.hop===breakHop&&breakKind!=='none';
    let tag='';
    let bk=null;
    if(isMarkPt&&breakKind==='real'){ tag='疑似断点'; bk='real'; }
    else if(isMarkPt&&breakKind==='icmp_filtered'){ tag='ICMP 盲区'; bk='icmp_filtered'; }
    else if(isMarkPt&&breakKind==='endpoint'){ tag='应用层异常'; bk='endpoint'; }
    else if(st==='filtered') tag='ICMP过滤';
    else if(st==='break'||st==='after') tag='无响应';
    const isMergedTarget=merged && idx===hops.length-1;
    const node={
      kind:isMergedTarget?'target':'hop', status:isMergedTarget?(p.status||'green'):st,
      hopNum:h.hop||'?',
      label:isMergedTarget?((p.label||'目标')+' · '+(p.resolve_ip||p.ip||'')):hopLabel(h),
      rtt:h.rtt_ms!=null?Number(h.rtt_ms).toFixed(1):null,
      tag,
      pulse:isMergedTarget?(p.status==='red'):(isMarkPt||st==='break'||st==='after'),
      breakPoint:isMarkPt,
      breakKind:bk,
    };
    nodes.push(node);
  });
  if(!merged){
    nodes.push({
      kind:'target', status:p.status||'green', pulse:p.status==='red',
      label:(p.label||'目标')+' · '+(p.ip||''),
    });
  }

  const layout=layoutSerpentine(nodes.length, 920, 480, 36);
  svg.setAttribute('viewBox',`0 0 ${layout.W} ${layout.totalH}`);

  let html=svgDefs();
  html+=`<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>`;
  const routeChanged=!!(p.route_changed||routeDiff);
  const pathBadge=`共 ${hops.length} 跳 · ${p.label||''}${routeChanged?' · 路径变化':''}`;
  const badgeMaxW=layout.W-24-(pending?160:0);
  html+=svgTopoBadge(pathBadge, 12, 8, badgeMaxW);
  if(pending){
    html+=`<rect x="760" y="8" width="148" height="28" rx="6" fill="rgba(120,53,15,.55)" stroke="rgba(245,158,11,.45)"/>`;
    html+=`<text x="834" y="27" fill="#fde68a" text-anchor="middle" font-size="11" font-weight="700">追踪进行中…</text>`;
  }

  for(let i=0;i<layout.pts.length-1;i++){
    const a=layout.pts[i], b=layout.pts[i+1];
    const nxt=nodes[i+1];
    const st=nxt.status||'ok';
    const isReal=nxt.breakKind==='real';
    const isIcmp=nxt.breakKind==='icmp_filtered';
    const isEp=nxt.breakKind==='endpoint';
    const col=isReal?'#ef4444':(isIcmp?'#f59e0b':(isEp?'#a78bfa':hopStatusColor(st)));
    const isHotEdge=isReal||isIcmp||isEp||st==='break'||st==='after';
    if(isHotEdge){
      html+=topoFlowEdge(a, b, true, col, 4.5, 'flow'+(isReal?' break-edge':(isIcmp?' icmp-edge':'')));
    } else if(pending){
      html+=`<path d="${topoEdgePath(a,b)}" fill="none" stroke="url(#gradFlow)" stroke-width="2.6" opacity=".8" class="flow pending-edge"/>`;
    } else {
      html+=topoFlowEdge(a, b, false, col, 4.5, '');
    }
  }

  layout.pts.forEach((pt,i)=>{
    html+=renderHopNode(pt, nodes[i], layout);
  });

  svg.innerHTML=html;
  const poolInfo=getRotatePool(paths);
  const idx=Math.max(0,poolInfo.pool.findIndex(x=>x.tid===selectedTid));
  if(updateBadge) updateRotateBadge(poolInfo,idx);
  const tabs=paths.map(pp=>`<button class="winbtn${pp.tid===selectedTid?' active':''}" style="margin:0 4px 8px 0" onclick="selectPath('${escAttr(pp.tid)}')">${esc(pp.label)}</button>`).join('');
  const detail=(summary.text||'路径完整')+
    (pending?' · 追踪进行中（读缓存，不强制刷新）':'');
  let routeNote=routeDiff?renderRouteCompare(routeDiff):'';
  let breakNote='';
  if(breakHop&&breakKind==='real'){
    breakNote=`<div style="margin-top:6px;padding:8px 10px;border-radius:6px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fecaca;font-size:12px;font-weight:600">⚠ 疑似断点：第 ${breakHop} 跳${summary.break_at&&summary.break_at.ip?' · '+esc(summary.break_at.ip):''} — TCP 端口也不通</div>`;
  } else if(breakHop&&breakKind==='icmp_filtered'){
    let okHint='监测正常';
    const pt=(p.ping_type||'').toLowerCase();
    if(summary.service_ok&&pt==='dns') okHint='DNS 查询正常';
    else if(summary.service_ok&&(pt==='http'||pt==='https')) okHint='HTTP 监测正常';
    else {
      const ports=(p.tcp_checks||[]).filter(c=>c.success).map(c=>c.port).slice(0,4);
      if(ports.length) okHint=`${ports.join('/')} 端口检测正常`;
    }
    breakNote=`<div style="margin-top:6px;padding:8px 10px;border-radius:6px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.35);color:#bbf7d0;font-size:12px"><span style="font-weight:700;color:var(--green)">✓ ICMP 盲区（${esc(okHint)}）</span><br><span style="color:var(--dim);font-size:11px">traceroute 在第 ${breakHop} 跳后不可见，多为设备过滤 ICMP，不等于路径故障</span></div>`;
  } else if(breakHop&&breakKind==='endpoint'){
    breakNote=`<div style="margin-top:6px;padding:8px 10px;border-radius:6px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.35);color:#ddd6fe;font-size:12px"><span style="font-weight:700;color:#c4b5fd">◆ 应用层异常</span><br><span style="color:var(--dim);font-size:11px">第 ${breakHop} 跳后 ICMP 不可见，但故障原因在应用/DNS 层；路径拓扑仅供参考</span></div>`;
  }
  document.getElementById('topoDetail').innerHTML=tabs+
    routeNote+
    breakNote+
    `<div style="margin-top:6px">${esc(detail)}</div>`+
    `<div style="margin-top:4px;font-size:11px;color:var(--dim)">${merged
      ? `可视化 ${nodes.length} 个节点（源 + ${hops.length} 跳），最后一跳即监测目标`
      : `可视化 ${nodes.length} 个节点（源 + ${hops.length} 跳 + 监测目标），traceroute 未在最后一跳到达目标 IP`}</div>`;
  requestAnimationFrame(()=>markScrollable(document.getElementById('topoDetail')));
}

function selectPath(tid){
  focusPath(tid,{pauseMs:ROTATE.manualPauseMs,render:true});
}

async function refreshLivePanels(){
  const seq=++screenDataSeq;
  try{
    const [paths,geo,ov,top]=await Promise.all([
      api('paths'), api('geo'), api('overview',{fresh:true}), api('topn')]);
    if(seq!==screenDataSeq) return;
    pathsData=paths;
    geoData=geo;
    renderOverview(ov);
    renderTopo(pathsData);
    refreshRotateState(false);
    renderTop(top);
    noteDataError({paths:paths, geo:geo, overview:ov, topn:top});
  }catch(_){}
}

async function refreshPaths(){
  return refreshLivePanels();
}

async function refreshOverviewAndTop(){
  return refreshLivePanels();
}

function renderTop(top){
  const sla=(top.lowest_sla||[]).slice(0,5);
  const lat=(top.highest_latency||[]).slice(0,5);
  const out=(top.most_outages||[]).slice(0,5);
  const maxLat=Math.max(1,...lat.map(r=>Number(r.lat_p95||r.lat_avg||0)));
  const maxOut=Math.max(1,...out.map(r=>Number(r.outage_seconds||0)));
  document.getElementById('topSla').innerHTML=sla.length?sla.map((r,i)=>{
    const pct=Math.max(0,Math.min(100,Number(r.uptime_pct)||0));
    return `<div class="toprow"><span class="top-rank">${i+1}</span><span class="top-name">${esc(r.label)}</span>`+
      `<div class="top-bar-wrap"><div class="top-bar" style="width:${pct}%"></div></div>`+
      `<span class="top-val">${r.uptime_pct!=null?r.uptime_pct.toFixed(2)+'%':'--'}</span></div>`;
  }).join('')
    :'<div style="color:var(--dim);font-size:12px;padding:8px">暂无</div>';
  document.getElementById('topLat').innerHTML=lat.length?lat.map((r,i)=>{
    const v=Number(r.lat_p95||r.lat_avg||0);
    const pct=Math.max(4,Math.min(100,(v/maxLat)*100));
    return `<div class="toprow"><span class="top-rank">${i+1}</span><span class="top-name">${esc(r.label)}</span>`+
      `<div class="top-bar-wrap"><div class="top-bar lat" style="width:${pct}%"></div></div>`+
      `<span class="top-val">${r.lat_p95!=null?r.lat_p95+' ms':(r.lat_avg!=null?r.lat_avg+' ms':'--')}</span></div>`;
  }).join('')
    :'<div style="color:var(--dim);font-size:12px;padding:8px">暂无</div>';
  document.getElementById('topOutages').innerHTML=out.length?out.map((r,i)=>{
    const sec=Number(r.outage_seconds||0);
    const cnt=Number(r.outage_count||0);
    const pct=Math.max(4,Math.min(100,(sec/maxOut)*100));
    return `<div class="toprow"><span class="top-rank">${i+1}</span><span class="top-name">${esc(r.label)}</span>`+
      `<div class="top-bar-wrap"><div class="top-bar outage" style="width:${pct}%"></div></div>`+
      `<span class="top-val">${cnt}次 · ${formatDur(sec)}</span></div>`;
  }).join('')
    :'<div style="color:var(--dim);font-size:12px;padding:8px">暂无</div>';
}

function renderEvents(ev){
  const rows=(ev&&ev.events)||ev||[];
  document.getElementById('eventLine').innerHTML=rows.length?rows.map(r=>{
    const cls=eventRowClass(r);
    const tag=EVENT_TYPE_LABEL[r.type]||'';
    const etype=tag?`<span class="etype">${esc(tag)}</span>`:'';
    return `<div class="trow ${cls}"><span>${esc(r.time||'--')}</span><span>${esc(r.label||'')}</span><span>${esc(r.text||'')}${etype}</span></div>`;
  }).join(''):'<div style="color:var(--dim);font-size:12px">暂无事件</div>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function escAttr(s){return esc(s).replace(/'/g,'&#39;');}

function toggleFs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

function connectSSE(){
  if(DEMO) return;
  const es=new EventSource('/events');
  let debAll=null, debPaths=null;
  es.onmessage=e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.type==='heartbeat') return;
      if(m.type==='trace_break'){
        clearTimeout(debPaths);
        debPaths=setTimeout(()=>{
          refreshLivePanels().then(()=>onTraceFaultSSE(m));
        },400);
        return;
      }
      if(m.type==='trace_heal'){
        clearTimeout(debPaths);
        debPaths=setTimeout(()=>{
          refreshLivePanels().then(()=>onTraceHealSSE(m));
          api('events').then(renderEvents).catch(()=>{});
        },400);
        return;
      }
      if(m.type==='route_changed'){
        clearTimeout(debPaths);
        debPaths=setTimeout(()=>{
          refreshLivePanels().then(()=>onRouteChangedSSE(m));
          api('events').then(renderEvents).catch(()=>{});
        },400);
        return;
      }
      if(m.type==='update'&&m.target&&topoMode==='single'){
        const st=m.target.status;
        if(st==='red'||st==='orange') onTraceFaultSSE(m.target);
      }
      clearTimeout(debAll);
      debAll=setTimeout(loadAll,1200);
    }catch(_){}
  };
  es.onerror=()=>{es.close(); setTimeout(connectSSE,5000);};
}
connectSSE();
initExplainBanner();
syncCenterPanelMode();
loadAll();
requestAnimationFrame(()=>markScrollable());
refreshTimer=setInterval(loadAll,15000);

(function decoratePanels(){
  const svg='<svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="M2 26V10c0-5 2.5-8 8-8h18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'+
    '<circle cx="8" cy="8" r="2" fill="currentColor" opacity=".9"/>'+
    '<path d="M2 26h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".5"/></svg>';
  document.querySelectorAll('.panel:not(.topbar)').forEach(p=>{
    if(p.querySelector('.corner')) return;
    ['c-tl','c-tr','c-bl','c-br'].forEach(cls=>{
      const d=document.createElement('div');
      d.className='corner '+cls;
      d.innerHTML=svg;
      p.appendChild(d);
    });
  });
})();
