<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络链路态势大屏</title>
<style>
:root{
  --bg:#030712;--panel:#0a1628;--border:#1e3a5f;--text:#e2e8f0;--dim:#94a3b8;
  --cyan:#22d3ee;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;--purple:#a78bfa;
  --panel-cut:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei",sans-serif}
#stage{width:1920px;height:1080px;transform-origin:0 0;position:absolute;overflow:hidden;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(34,211,238,.14),transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 100%,rgba(167,139,250,.08),transparent 50%),
    radial-gradient(ellipse 50% 35% at 0% 80%,rgba(34,197,94,.05),transparent 45%),
    linear-gradient(180deg,#030712 0%,#060d1a 45%,#0a1020 100%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(34,211,238,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.04) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 20%,transparent 100%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(34,211,238,.03) 50%,transparent 100%);
  animation:stageScan 6s ease-in-out infinite}
@keyframes stageScan{0%,100%{transform:translateY(-100%);opacity:0}45%{opacity:1}100%{transform:translateY(100%)}}
.grid{display:grid;grid-template-columns:400px 1fr 400px;grid-template-rows:minmax(96px,auto) 1fr 188px;
  gap:12px;padding:12px;height:100%;position:relative;z-index:1}
.panel{
  --pc:var(--cyan);
  position:relative;overflow:hidden;
  background:
    linear-gradient(145deg,rgba(34,211,238,.07) 0%,transparent 42%),
    linear-gradient(180deg,rgba(12,24,44,.92),rgba(5,11,22,.88));
  border:1px solid rgba(34,211,238,.18);
  clip-path:polygon(
    0 var(--panel-cut),var(--panel-cut) 0,
    calc(100% - var(--panel-cut)) 0,100% var(--panel-cut),
    100% calc(100% - var(--panel-cut)),calc(100% - var(--panel-cut)) 100%,
    var(--panel-cut) 100%,0 calc(100% - var(--panel-cut)));
  box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,0 12px 40px rgba(0,0,0,.35),
    0 0 24px rgba(34,211,238,.04) inset}
.panel::before{content:"";position:absolute;top:0;left:18%;right:18%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.55),transparent);
  opacity:.85}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(135deg,rgba(34,211,238,.12),transparent 28%),
    linear-gradient(315deg,rgba(167,139,250,.08),transparent 24%);
  mask:linear-gradient(#000,transparent 55%)}
.panel .corner{position:absolute;width:22px;height:22px;pointer-events:none;z-index:2;
  color:rgba(34,211,238,.55)}
.panel .corner svg{width:100%;height:100%;filter:drop-shadow(0 0 4px rgba(34,211,238,.5))}
.panel .c-tl{top:4px;left:4px}.panel .c-tr{top:4px;right:4px;transform:scaleX(-1)}
.panel .c-bl{bottom:4px;left:4px;transform:scaleY(-1)}.panel .c-br{bottom:4px;right:4px;transform:scale(-1,-1)}
.ptitle{font-size:13px;font-weight:700;color:var(--cyan);letter-spacing:.12em;text-transform:uppercase;
  padding:11px 16px 9px;display:flex;align-items:center;gap:10px;position:relative;z-index:1;
  border-bottom:1px solid rgba(34,211,238,.12);
  background:linear-gradient(90deg,rgba(34,211,238,.1),transparent 70%)}
.ptitle::before{content:"";width:4px;height:14px;border-radius:2px;flex-shrink:0;
  background:linear-gradient(180deg,var(--cyan),var(--purple));
  box-shadow:0 0 10px rgba(34,211,238,.55)}
.pbody{padding:12px 14px;height:calc(100% - 42px);overflow:auto;position:relative;z-index:1;
  overflow-x:hidden;scrollbar-width:thin;scrollbar-color:transparent transparent}
.pbody.has-scroll:hover,.tline.has-scroll:hover,.topo-detail.has-scroll:hover{scrollbar-color:rgba(34,211,238,.42) rgba(8,16,32,.88)}
.pbody::-webkit-scrollbar,.tline::-webkit-scrollbar,.topo-detail::-webkit-scrollbar{width:6px;height:6px}
.pbody::-webkit-scrollbar-track,.tline::-webkit-scrollbar-track,.topo-detail::-webkit-scrollbar-track{background:transparent;border-radius:999px}
.pbody.has-scroll:hover::-webkit-scrollbar-track,.tline.has-scroll:hover::-webkit-scrollbar-track,.topo-detail.has-scroll:hover::-webkit-scrollbar-track{
  background:rgba(8,16,32,.75);margin:4px 0}
.pbody::-webkit-scrollbar-thumb,.tline::-webkit-scrollbar-thumb,.topo-detail::-webkit-scrollbar-thumb{
  border-radius:999px;background:transparent;border:1px solid transparent;box-shadow:none}
.pbody.has-scroll:hover::-webkit-scrollbar-thumb,.tline.has-scroll:hover::-webkit-scrollbar-thumb,.topo-detail.has-scroll:hover::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(34,211,238,.55),rgba(167,139,250,.45));
  border-color:rgba(34,211,238,.25);box-shadow:0 0 8px rgba(34,211,238,.2)}
.pbody.has-scroll:hover::-webkit-scrollbar-thumb:hover,.tline.has-scroll:hover::-webkit-scrollbar-thumb:hover,.topo-detail.has-scroll:hover::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,rgba(34,211,238,.75),rgba(167,139,250,.6));
  box-shadow:0 0 12px rgba(34,211,238,.35)}
.pbody::-webkit-scrollbar-corner,.tline::-webkit-scrollbar-corner,.topo-detail::-webkit-scrollbar-corner{background:transparent}
.topbar{grid-column:1/-1;display:flex;align-items:stretch;justify-content:space-between;
  padding:12px 22px 12px 16px;min-height:100px}
.topbar.panel{--panel-cut:16px;background:
  linear-gradient(90deg,rgba(34,211,238,.12),transparent 38%,transparent 62%,rgba(167,139,250,.08)),
  linear-gradient(180deg,rgba(8,18,36,.96),rgba(5,11,22,.92))}
.topbar.panel::after{opacity:.28;mask-image:linear-gradient(90deg,transparent 0%,#000 42%)}
.topbar.panel .corner{display:none}
.topbar-brand{position:relative;z-index:5;padding:4px 0 2px 40px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.topbar-brand::before{content:"";position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:4px;height:56px;border-radius:2px;
  background:linear-gradient(180deg,var(--cyan),var(--purple));
  box-shadow:0 0 12px rgba(34,211,238,.55)}
.topbar-actions{display:flex;align-items:flex-start;gap:8px;flex-shrink:0;padding-top:6px}
.topbar h1{font-size:26px;font-weight:800;line-height:1.2;margin:0;
  background:linear-gradient(92deg,#e0f2fe,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.06em;
  filter:drop-shadow(0 0 18px rgba(34,211,238,.25))}
.topbar h1 .sub{display:block;font-size:11px;font-weight:600;letter-spacing:.22em;margin-top:6px;
  -webkit-text-fill-color:rgba(34,211,238,.5);background:none;line-height:1.3}
.topmeta{font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.topmeta span{padding:3px 10px;border-radius:999px;background:rgba(15,23,42,.55);
  border:1px solid rgba(30,58,95,.45)}
.btn{background:linear-gradient(180deg,rgba(34,211,238,.16),rgba(34,211,238,.06));
  border:1px solid rgba(34,211,238,.4);color:#a5f3fc;padding:6px 14px;border-radius:4px;
  cursor:pointer;font-size:12px;text-decoration:none;transition:all .2s;
  box-shadow:0 0 12px rgba(34,211,238,.12)}
.btn:hover{background:linear-gradient(180deg,rgba(34,211,238,.28),rgba(34,211,238,.12));
  box-shadow:0 0 20px rgba(34,211,238,.25)}
.winbtn{padding:5px 12px;margin-left:4px;border-radius:3px;border:1px solid rgba(30,58,95,.65);
  background:rgba(8,16,32,.6);color:var(--dim);cursor:pointer;font-size:11px;transition:all .2s}
.winbtn:hover{border-color:rgba(34,211,238,.35);color:#cbd5e1}
.winbtn.active{border-color:var(--cyan);color:var(--cyan);
  background:linear-gradient(180deg,rgba(34,211,238,.18),rgba(34,211,238,.05));
  box-shadow:0 0 14px rgba(34,211,238,.2),inset 0 0 12px rgba(34,211,238,.08)}
.gauge{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:10px;
  background:linear-gradient(135deg,rgba(15,23,42,.5),transparent);
  border:1px solid rgba(30,58,95,.35);clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.ring{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;position:relative;flex-shrink:0;
  border:3px solid var(--cyan);
  background:radial-gradient(circle at 35% 30%,rgba(34,211,238,.2),rgba(5,11,24,.9) 65%);
  box-shadow:0 0 24px rgba(34,211,238,.28),inset 0 0 20px rgba(34,211,238,.08);
  animation:ringGlow 3s ease-in-out infinite}
.ring::before{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:1px dashed rgba(34,211,238,.30);animation:ringSpin 18s linear infinite}
.ring::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(
    var(--arc,var(--cyan)) 0turn,
    var(--arc,var(--cyan)) calc(var(--pct,0)*1turn),
    rgba(100,116,139,.12) calc(var(--pct,0)*1turn),
    rgba(100,116,139,.12) 1turn);
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
          mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  transition:--pct .9s ease;filter:drop-shadow(0 0 4px var(--arc,var(--cyan)))}
@property --pct{syntax:'<number>';inherits:false;initial-value:0}
@keyframes ringGlow{0%,100%{box-shadow:0 0 24px rgba(34,211,238,.28),inset 0 0 20px rgba(34,211,238,.08)}
  50%{box-shadow:0 0 32px rgba(34,211,238,.4),inset 0 0 26px rgba(34,211,238,.12)}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.risk-pbody{display:flex;flex-direction:column;min-height:0}
.radar-wrap{flex:1;display:flex;align-items:center;justify-content:center;
  min-height:210px;padding:8px 0 6px}
#healthRadar{width:min(100%,340px);height:auto;aspect-ratio:1;display:block}
.stat{background:linear-gradient(135deg,rgba(15,23,42,.75),rgba(8,16,32,.5));
  border:1px solid rgba(30,58,95,.45);padding:10px 10px 10px 14px;position:relative;overflow:hidden;
  clip-path:polygon(0 6px,6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--cyan));opacity:.85}
.stat .k{font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.stat .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;
  text-shadow:0 0 20px currentColor}
.v.green{color:var(--green)} .v.orange{color:var(--orange)} .v.red{color:var(--red)}
.center{grid-row:2;grid-column:2;display:flex;flex-direction:column;min-height:0}
.center.panel{--pc:var(--purple)}
.topo-wrap{position:relative;flex:1;min-height:0;display:flex;
  border:1px solid rgba(34,211,238,.15);
  box-shadow:0 0 40px rgba(34,211,238,.04) inset,0 4px 24px rgba(0,0,0,.3);
  background:
    radial-gradient(ellipse at 50% 42%,rgba(34,211,238,.07),transparent 62%),
    rgba(3,8,18,.78)}
.topo-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* concentric command-platform rings */
.topo-bg::before{content:"";position:absolute;left:50%;top:50%;width:520px;height:520px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:
    repeating-radial-gradient(circle at center,
      transparent 0 64px,rgba(34,211,238,.05) 64px 65px);
  -webkit-mask:radial-gradient(circle at center,#000 58%,transparent 72%);
          mask:radial-gradient(circle at center,#000 58%,transparent 72%)}
/* sweeping radar beam */
.topo-bg::after{content:"";position:absolute;left:50%;top:50%;width:520px;height:520px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(from 0deg,rgba(34,211,238,.11),transparent 26%,transparent 100%);
  -webkit-mask:radial-gradient(circle at center,#000 56%,transparent 70%);
          mask:radial-gradient(circle at center,#000 56%,transparent 70%);
  animation:radarSweep 7s linear infinite;opacity:.42}
@keyframes radarSweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
#topoSvg{position:relative;z-index:1;width:100%;flex:1;min-height:0;display:block;
  background:transparent;border:0}
.topo-detail{margin-top:8px;font-size:12px;color:var(--dim);
  min-height:52px;max-height:min(34vh,280px);overflow-y:auto;overflow-x:hidden;
  padding:8px 12px;
  background:linear-gradient(90deg,rgba(15,23,42,.65),rgba(8,16,32,.45));
  border:1px solid rgba(30,58,95,.4);border-left:3px solid rgba(34,211,238,.45);
  flex-shrink:0;scrollbar-width:thin;scrollbar-color:transparent transparent}
.center.panel.geo-mode .topo-detail{max-height:80px}
.toplist{display:flex;flex-direction:column;gap:6px}
.toprow{display:grid;grid-template-columns:22px 1fr 72px 56px;gap:8px;align-items:center;
  font-size:12px;padding:7px 8px;
  background:rgba(8,16,32,.45);border:1px solid rgba(30,58,95,.25);border-radius:2px}
.toprow:hover{background:rgba(34,211,238,.04);border-color:rgba(34,211,238,.15)}
.top-rank{font-size:10px;font-weight:800;color:var(--cyan);opacity:.7;text-align:center}
.top-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-bar-wrap{height:5px;background:rgba(15,23,42,.8);border-radius:999px;overflow:hidden;
  border:1px solid rgba(30,58,95,.4)}
.top-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--purple));
  box-shadow:0 0 8px rgba(34,211,238,.45);transition:width .6s ease}
.top-bar.lat{background:linear-gradient(90deg,var(--orange),var(--red))}
.top-bar.outage{background:linear-gradient(90deg,var(--red),#7f1d1d)}
.top-val{font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:#cbd5e1}
.timeline{grid-column:1/-1}
.tline{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:transparent transparent;padding-right:2px}
.trow{display:grid;grid-template-columns:72px 120px 1fr;gap:10px;font-size:12px;padding:8px 10px;
  border-radius:2px;background:linear-gradient(90deg,rgba(15,23,42,.55),rgba(8,16,32,.35));
  border:1px solid rgba(30,58,95,.3);animation:fadeIn .4s ease;transition:opacity .6s ease,transform .6s ease}
.trow.pinned{background:linear-gradient(90deg,rgba(127,29,29,.22),rgba(15,23,42,.55));
  border-color:rgba(239,68,68,.35);animation:pulsePinned 2.4s ease-in-out infinite}
.trow.route{border-left:3px solid var(--cyan);box-shadow:inset 4px 0 12px rgba(34,211,238,.08)}
.trow.recovery{border-left:3px solid var(--green);animation:recoveryIn .8s ease}
.trow.recovery-flash{border-left:3px solid var(--green);animation:recoveryFlash 3s ease forwards}
.trow.recovery-flash.fade-out{opacity:0;transform:translateX(8px)}
.trow.webhook{border-left:3px solid var(--orange)}
.trow .etype{font-size:10px;color:var(--dim);margin-left:6px;opacity:.85}
.trow.red{border-left:3px solid var(--red);box-shadow:inset 4px 0 12px rgba(239,68,68,.08)}
.trow.orange{border-left:3px solid var(--orange);box-shadow:inset 4px 0 12px rgba(245,158,11,.06)}
.trow.green{border-left:3px solid var(--green)}
@keyframes pulsePinned{0%,100%{box-shadow:inset 4px 0 12px rgba(239,68,68,.08)}50%{box-shadow:inset 4px 0 18px rgba(239,68,68,.18)}}
@keyframes recoveryIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes recoveryFlash{0%{background:rgba(34,197,94,.18)}100%{background:linear-gradient(90deg,rgba(15,23,42,.55),rgba(8,16,32,.35))}}
.route-compare{margin-top:8px;padding:10px 12px;border-radius:4px;
  background:linear-gradient(90deg,rgba(8,47,73,.55),rgba(15,23,42,.45));
  border:1px solid rgba(34,211,238,.35);animation:routePulse 2.2s ease-in-out infinite}
.route-compare .rc-title{font-size:11px;font-weight:700;color:var(--cyan);margin-bottom:8px;letter-spacing:.06em}
.route-compare .rc-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;margin-bottom:6px}
.route-compare .rc-label{color:var(--dim);min-width:42px}
.route-compare .rc-hop{padding:2px 8px;border-radius:999px;background:rgba(15,23,42,.65);
  border:1px solid rgba(30,58,95,.45);font-variant-numeric:tabular-nums}
.route-compare .rc-hop.changed{border-color:rgba(34,211,238,.65);color:#a5f3fc;
  box-shadow:0 0 10px rgba(34,211,238,.25);animation:hopChanged 1.4s ease-in-out infinite}
@keyframes routePulse{0%,100%{border-color:rgba(34,211,238,.35)}50%{border-color:rgba(34,211,238,.65)}}
@keyframes hopChanged{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.topo-pending #topoSvg{border-color:rgba(245,158,11,.45);
  box-shadow:0 0 30px rgba(245,158,11,.12) inset,0 4px 24px rgba(0,0,0,.3);
  animation:pendingScan 2s ease-in-out infinite}
@keyframes pendingScan{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08)}}
.explain-banner{margin-top:8px;padding:6px 12px;font-size:11px;color:#bae6fd;
  background:linear-gradient(90deg,rgba(8,47,73,.75),rgba(15,23,42,.55));
  border:1px solid rgba(34,211,238,.35);border-radius:2px;letter-spacing:.04em;max-width:720px}
.explain-banner.hidden{display:none}
.data-error-banner{margin-top:8px;padding:6px 12px;font-size:12px;color:#fecaca;font-weight:600;
  background:linear-gradient(90deg,rgba(127,29,29,.85),rgba(15,23,42,.55));
  border:1px solid rgba(239,68,68,.55);border-radius:2px;letter-spacing:.03em;max-width:860px}
.data-error-banner.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.flow{stroke-dasharray:8 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.edge-base{opacity:.45}
.flow-comet{stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(186,230,253,.7));animation:cometRun 1.5s linear infinite}
@keyframes cometRun{to{stroke-dashoffset:-340}}
@keyframes breakRipple{0%{transform:scale(.75);opacity:.9}100%{transform:scale(1.65);opacity:0}}
@keyframes breakRing{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.72}}
@keyframes breakEdge{0%,100%{stroke-opacity:.85}50%{stroke-opacity:1}}
.break-ripple{animation:breakRipple 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.break-ring{animation:breakRing 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.break-edge{animation:breakEdge 1s ease-in-out infinite;stroke-width:4.5}
.break-node .break-tag-bg{fill:rgba(239,68,68,.35);stroke:#ef4444;stroke-width:1.2}
.icmp-blind-node .icmp-tag-bg{fill:rgba(245,158,11,.35);stroke:#f59e0b;stroke-width:1.2}
.endpoint-node .endpoint-tag-bg{fill:rgba(167,139,250,.28);stroke:#a78bfa;stroke-width:1.2}
.icmp-ripple{animation:breakRipple 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.icmp-ring{animation:breakRing 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.icmp-edge{animation:breakEdge 1.4s ease-in-out infinite;stroke-width:3.5}
.rotate-badge{font-size:11px;color:var(--cyan);padding:5px 12px;border-radius:2px;
  border:1px solid rgba(34,211,238,.35);
  background:linear-gradient(90deg,rgba(34,211,238,.12),rgba(34,211,238,.04));
  margin-left:auto;letter-spacing:.04em;
  box-shadow:0 0 12px rgba(34,211,238,.1)}
.rotate-badge.fault{color:#fca5a5;border-color:rgba(239,68,68,.45);
  background:linear-gradient(90deg,rgba(239,68,68,.14),rgba(239,68,68,.04))}
.rotate-status{font-size:10px;color:var(--dim);line-height:1.35;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(36vw,320px)}
.rotate-status.fault{color:#fca5a5}
.score-hint{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.45;max-width:260px;opacity:.85}
.topo-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  margin-bottom:6px;width:100%;flex-shrink:0}
.topo-toolbar-btns{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}
.tb-div{width:1px;align-self:stretch;margin:3px 2px;flex-shrink:0;
  background:linear-gradient(180deg,transparent,rgba(34,211,238,.4),transparent)}
#centerPanel:not(.geo-mode) .tb-div{display:none}
.topo-toolbar-rotate{display:flex;align-items:center;gap:6px;flex-shrink:0;max-width:min(42%,360px)}
#centerPanel:not(.geo-mode) #btnMapChina,
#centerPanel:not(.geo-mode) #btnMapWorld,
#centerPanel:not(.geo-mode) #btnGeoFit{display:none}
.center.panel.geo-mode .topo-bg{display:none}
#geoChart{display:none}
.center.panel.geo-mode .topo-wrap{
  position:relative;flex:1;min-height:0;flex-direction:column;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(34,211,238,.10),transparent 58%),
    repeating-linear-gradient(0deg,rgba(56,189,248,.035) 0 1px,transparent 1px 46px),
    repeating-linear-gradient(90deg,rgba(56,189,248,.035) 0 1px,transparent 1px 46px),
    linear-gradient(180deg,rgba(2,8,20,.94),rgba(3,11,26,.92))}
.center.panel.geo-mode .topo-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 120px rgba(2,8,20,.65);
  background:radial-gradient(ellipse at 50% 46%,transparent 62%,rgba(2,8,20,.45) 100%)}
.center.panel.geo-mode #geoChart{
  position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block}
.center.panel.geo-mode #topoSvg{display:none}
#geoInset{display:none;margin-top:6px;padding:8px 10px;border:1px solid rgba(30,58,95,.45);
  background:rgba(8,16,32,.55);border-radius:4px;max-height:72px;overflow:auto;flex-shrink:0}
.center.panel.geo-mode #geoInset.has-inset{display:block}
.geo-inset-title{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-bottom:6px}
/* 3D globe (globe.gl) — twin of the 2D geo map; shares the dark/cyan theme */
#globeViz{position:absolute;inset:0;z-index:1;display:none}
.center.panel.globe-on #globeViz{display:block;z-index:3}
.center.panel.globe-on #geoChart{display:none}
.center.panel.globe-on #geoInset{display:none!important}
.center.panel.globe-on .topo-wrap::after{display:none}
#centerPanel:not(.geo-mode) #btnGlobe{display:none}
#centerPanel:not(.globe-on) #btnGlobeNight,#centerPanel:not(.globe-on) #btnGlobeReal{display:none}
.glb-tag{font:600 11px/1.2 "Segoe UI","Microsoft YaHei",sans-serif;color:#bae6fd;
  background:rgba(8,16,32,.74);border:1px solid rgba(34,211,238,.4);border-radius:3px;
  padding:1px 6px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-150%);
  text-shadow:0 0 6px rgba(0,0,0,.7)}
/* node labels double as large click targets (the dots are hard to hit on a sphere) */
.glb-tag.glb-clickable{pointer-events:auto;cursor:pointer}
.glb-tag.glb-clickable:hover{border-color:#38e0ff;color:#e0f2fe;background:rgba(8,16,32,.94)}
/* globe search/jump overlay — find a node or country, Enter flies the camera to it */
#globeSearch{position:absolute;top:10px;left:10px;z-index:6;width:250px;display:none;
  font-family:"Segoe UI","Microsoft YaHei",sans-serif}
.center.panel.globe-on #globeSearch{display:block}
#globeSearchInput{width:100%;box-sizing:border-box;padding:6px 10px;border-radius:4px;
  border:1px solid rgba(34,211,238,.35);background:rgba(8,16,32,.82);color:#e0f2fe;font-size:12px;outline:none}
#globeSearchInput::placeholder{color:#5b7591}
#globeSearchInput:focus{border-color:rgba(56,224,255,.7);box-shadow:0 0 10px rgba(56,224,255,.25)}
#globeSearchResults{margin-top:4px;border-radius:4px;border:1px solid rgba(34,211,238,.3);
  background:rgba(8,14,28,.95);max-height:248px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#globeSearchResults.hidden{display:none}
.gs-group{font-size:10px;letter-spacing:.1em;color:#5b7591;padding:6px 10px 2px}
.gs-row{display:flex;align-items:center;gap:7px;padding:5px 10px;font-size:12px;color:#cbd5e1;
  cursor:pointer;white-space:nowrap}
.gs-row:hover,.gs-row.active{background:rgba(34,211,238,.16);color:#e0f2fe}
.gs-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.gs-flag{font-size:11px;opacity:.8}
.gs-sub{margin-left:auto;font-size:10px;color:#5b7591;padding-left:10px;overflow:hidden;text-overflow:ellipsis}
.gs-empty{padding:8px 10px;font-size:12px;color:#5b7591}
.geo-inset-grid{display:flex;flex-wrap:wrap;gap:6px}
.geo-inset-chip{font-size:11px;padding:4px 10px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(30,58,95,.55);background:rgba(15,23,42,.65);color:#cbd5e1}
.geo-inset-chip.red{border-color:rgba(239,68,68,.45);color:#fecaca}
.geo-inset-chip.orange{border-color:rgba(245,158,11,.45);color:#fde68a}
.geo-inset-chip.unlocated{border-style:dashed;opacity:.85}
.geo-inset-chip.overseas{border-color:rgba(34,211,238,.45);color:#a5f3fc}
.geo-inset-chip.active{border-color:rgba(34,211,238,.85);background:rgba(34,211,238,.18);
  box-shadow:0 0 12px rgba(34,211,238,.35);color:#e0f2fe}
.hidden{display:none}
</style>
</head>
<body>
<div id="stage">
<div class="grid">
  <div class="topbar panel">
    <div class="topbar-brand">
      <h1>网络链路态势大屏<span class="sub">NETWORK LINK OPERATIONS CENTER</span></h1>
      <div class="topmeta">
        <span id="clock">--</span>
        <span id="refreshHint">加载中...</span>
        <span id="countsHint">--</span>
      </div>
      <div class="explain-banner hidden" id="explainBanner"></div>
      <div class="data-error-banner hidden" id="dataErrorBanner"></div>
    </div>
    <div class="topbar-actions">
      <button class="winbtn screen-window-btn active" data-w="today" onclick="setWindow('today',this)">今日</button>
      <button class="winbtn screen-window-btn" data-w="1h" onclick="setWindow('1h',this)">近1小时</button>
      <button class="winbtn screen-window-btn" data-w="7d" onclick="setWindow('7d',this)">近7天</button>
      <a class="btn" href="/">返回控制台</a>
      <button class="btn" onclick="toggleFs()">全屏</button>
    </div>
  </div>

  <div class="panel" style="grid-row:2">
    <div class="ptitle">网络风险状况</div>
    <div class="pbody risk-pbody">
      <div class="gauge">
        <div class="ring" id="riskRing">--</div>
        <div><div style="font-size:11px;color:var(--dim)">风险指数</div>
          <div id="riskGrade" style="font-size:16px;font-weight:700;margin-top:4px">--</div>
          <div class="score-hint" id="riskHint"></div></div>
      </div>
      <div class="statgrid" id="riskStats"></div>
      <div class="ptitle" style="padding:14px 0 2px;font-size:11px">多维态势雷达<span style="margin-left:auto;font-size:10px;color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none">越靠外越健康</span></div>
      <div class="radar-wrap">
        <svg id="healthRadar" viewBox="0 0 320 320" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>
  </div>

  <div class="panel center geo-mode" id="centerPanel">
    <div class="ptitle">动态链路拓扑</div>
    <div class="pbody" style="display:flex;flex-direction:column;height:calc(100% - 42px)">
      <div class="topo-toolbar">
        <div class="topo-toolbar-btns">
          <button class="winbtn active" id="btnTopoGeo" onclick="setTopoMode('geo',this)">地理视图</button>
          <button class="winbtn" id="btnTopoSingle" onclick="setTopoMode('single',this)">单路径</button>
          <button class="winbtn" id="btnTopoMerged" onclick="setTopoMode('merged',this)">合并拓扑</button>
          <span class="tb-div" aria-hidden="true"></span>
          <button class="winbtn active" id="btnMapChina" onclick="setGeoMapMode('china',this)">中国</button>
          <button class="winbtn" id="btnMapWorld" onclick="setGeoMapMode('world',this)">世界</button>
          <button class="winbtn" id="btnGeoFit" onclick="resetGeoViewport()" title="恢复地图全貌（清除手动缩放/聚焦）">全貌</button>
          <button class="winbtn" id="btnGlobe" onclick="toggleGlobe(this)" title="3D 地球视图（2D⇄3D 切换；中国/世界/全貌作为相机视角）">🌐 地球</button>
          <button class="winbtn" id="btnGlobeNight" onclick="setGlobeStyle('night',this)" title="城市灯光地表 + 发光国界线">灯光</button>
          <button class="winbtn" id="btnGlobeReal" onclick="setGlobeStyle('real',this)" title="真实地表">写实</button>
        </div>
        <div class="topo-toolbar-rotate">
          <button class="winbtn active" id="btnAutoRotate" onclick="toggleAutoRotate(this)">自动轮播</button>
          <span class="rotate-status hidden" id="rotateBadge"></span>
        </div>
      </div>
      <div class="topo-wrap">
        <div class="topo-bg"></div>
        <div id="geoChart"></div>
        <svg id="topoSvg" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="globeViz"></div>
        <div id="globeSearch">
          <input id="globeSearchInput" type="text" autocomplete="off" spellcheck="false"
                 placeholder="搜索节点 / 国家，回车定位">
          <div id="globeSearchResults" class="hidden"></div>
        </div>
      </div>
      <div id="geoInset"><div class="geo-inset-title">内网 / 未上图目标</div><div class="geo-inset-grid" id="geoInsetGrid"></div></div>
      <div class="topo-detail" id="topoDetail">选择节点或等待路径数据...</div>
    </div>
  </div>

  <div class="panel" style="grid-row:2">
    <div class="ptitle">网络健康 · TOP</div>
    <div class="pbody">
      <div class="gauge">
        <div class="ring" id="healthRing">--</div>
        <div><div style="font-size:11px;color:var(--dim)">健康评分</div>
          <div id="healthGrade" style="font-size:16px;font-weight:700;margin-top:4px">--</div>
          <div class="score-hint" id="healthHint"></div></div>
      </div>
      <div class="ptitle" style="padding:8px 0;font-size:11px">SLA 最低 TOP5</div>
      <div class="toplist" id="topSla"></div>
      <div class="ptitle" style="padding:8px 0;font-size:11px">P95 最高 TOP5</div>
      <div class="toplist" id="topLat"></div>
      <div class="ptitle" style="padding:8px 0;font-size:11px">中断最多 TOP5</div>
      <div class="toplist" id="topOutages"></div>
    </div>
  </div>

  <div class="panel timeline">
    <div class="ptitle">重点事件时间线</div>
    <div class="pbody"><div class="tline" id="eventLine"></div></div>
  </div>
</div>
</div>
<script src="/vendor/echarts.min.js"></script>
<script>
const DEMO=new URLSearchParams(location.search).get('demo')==='1';
const EXPLAIN=DEMO||new URLSearchParams(location.search).get('explain')==='1';
let WINDOW='today';
let pathsData=null;
let geoData=null;
let geoMapUserChoice=null;
let geoRenderSeq=0;
let screenDataSeq=0;
let geoViewportCache={key:'', mapMode:'', view:null};
let geoViewportMode='overview';
let geoUserRoam=false;
let geoUserView=null;
let geoRoamHooked=false;
const CHINA_BBOX={minLon:73,maxLon:135,minLat:18,maxLat:54};
const WORLD_BBOX={minLon:-168,maxLon:168,minLat:-52,maxLat:72};
let selectedTid=null;
let topoMode='geo';
let refreshTimer=null;
let rotateTimer=null;
let rotatePausedUntil=0;
let rotateIdx=0;
let rotatePoolKey='';
let routeCompareByTid={};
const EVENT_TYPE_LABEL={
  open_incident:'未恢复', incident_open:'故障', recovery:'恢复',
  route_changed:'路径', webhook_fail:'Webhook', paused:'暂停', resumed:'恢复监测',
  status_change:'状态',
};
const ROTATE={
  enabled:true,
  normalMs:20000,
  faultMs:8000,
  manualPauseMs:30000,
  recoverDelayMs:5000,
  minPaths:2,
};

function fitStage(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  const el=document.getElementById('stage');
  el.style.transform='scale('+s+')';
  el.style.left=((innerWidth-1920*s)/2)+'px';
  el.style.top=((innerHeight-1080*s)/2)+'px';
}
addEventListener('resize',()=>{fitStage();markScrollable();if(isGeoChartReady()) geoChart.resize();}); fitStage();

function markScrollable(root){
  const base=root||document;
  const els=[
    ...(base.matches&&base.matches('.pbody,.tline,.topo-detail')?[base]:[]),
    ...base.querySelectorAll('.pbody,.tline,.topo-detail'),
  ];
  els.forEach(el=>{
    const needs=el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1;
    el.classList.toggle('has-scroll',needs);
  });
}

function initExplainBanner(){
  if(!EXPLAIN) return;
  const el=document.getElementById('explainBanner');
  el.classList.remove('hidden');
  el.textContent=DEMO
    ? '演示模式 — 样例数据展示故障、路径变化、恢复与时间线；SSE 已关闭，仍按窗口轮询'
    : '讲解模式 — 关注左侧风险/右侧 TOP/中部拓扑与底部事件时间线的联动';
}

function formatDur(sec){
  sec=Number(sec)||0;
  if(sec<60) return Math.round(sec)+'s';
  if(sec<3600) return Math.round(sec/60)+'m';
  return (sec/3600).toFixed(1)+'h';
}

function eventRowClass(r){
  const t=r.type||'';
  if(r.pinned||t==='open_incident') return 'pinned';
  if(t==='route_changed') return 'route';
  if(t==='recovery') return 'recovery';
  if(t==='webhook_fail') return 'webhook';
  return r.level==='red'?'red':(r.level==='orange'?'orange':'green');
}

function renderRouteHopRow(label, ips, changedSet){
  const hops=(ips||[]).map((ip,i)=>{
    const cls=changedSet.has(i)?'rc-hop changed':'rc-hop';
    const txt=(ip&&ip!=='*')?esc(ip):'*';
    return `<span class="${cls}">${i+1}:${txt}</span>`;
  }).join('<span style="color:var(--dim);margin:0 2px">→</span>');
  return `<div class="rc-row"><span class="rc-label">${label}</span>${hops||'<span class="rc-hop">—</span>'}</div>`;
}

function renderRouteCompare(diff){
  if(!diff||!(diff.old_ips||diff.new_ips)) return '';
  const changed=new Set(diff.changed_hops||[]);
  return `<div class="route-compare">`+
    `<div class="rc-title">↔ 路径变化 · ${esc(diff.text||'路由切换')}</div>`+
    renderRouteHopRow('旧', diff.old_ips, changed)+
    renderRouteHopRow('新', diff.new_ips, changed)+
    `</div>`;
}

function getRouteCompareForPath(p){
  const live=routeCompareByTid[p.tid];
  if(live&&Date.now()<live.until) return live.diff||{old_ips:live.old_ips,new_ips:live.new_ips,changed_hops:[]};
  return p.route_diff||null;
}

function flashRecoveryEvent(m){
  const el=document.getElementById('eventLine');
  if(!el||!m) return;
  const row=document.createElement('div');
  row.className='trow green recovery-flash';
  row.innerHTML=`<span>${new Date().toLocaleTimeString('zh-CN',{hour12:false})}</span>`+
    `<span>${esc(m.label||m.tid||'')}</span>`+
    `<span>已恢复 · 链路恢复正常<span class="etype">恢复</span></span>`;
  el.prepend(row);
  setTimeout(()=>row.classList.add('fade-out'),2200);
  setTimeout(()=>row.remove(),3200);
}

function tickClock(){
  document.getElementById('clock').textContent=
    new Date().toLocaleString('zh-CN',{hour12:false});
}
setInterval(tickClock,1000); tickClock();

function setWindow(w,btn){
  WINDOW=w;
  document.querySelectorAll('.screen-window-btn').forEach(b=>b.classList.toggle('active',b===btn));
  loadAll();
}

function api(path, opts){
  const q=DEMO?'&demo=1':'';
  const fresh=(opts&&opts.fresh)?'&fresh=1':'';
  return fetch('/api/screen/'+path+'?window='+encodeURIComponent(WINDOW)+q+fresh)
    .then(r=>r.json());
}

/** Per-source backend-degradation tracking. A payload that carries an
 *  ``error`` field means the server fell back to an empty skeleton (NOT demo
 *  data); surface it as a red banner so the screen never passes off blanks
 *  as a healthy network. */
const dataErrors={};
function noteDataError(map){
  for(const k in map){
    const p=map[k];
    if(p&&p.error) dataErrors[k]=p.error; else delete dataErrors[k];
  }
  const el=document.getElementById('dataErrorBanner');
  if(!el) return;
  const msgs=[...new Set(Object.values(dataErrors))];
  if(msgs.length){
    el.textContent='⚠ 数据降级 · 部分后端聚合失败：'+msgs.slice(0,2).join(' / ')+(msgs.length>2?' 等':'');
    el.classList.remove('hidden');
  }else{
    el.classList.add('hidden');
  }
}

async function loadAll(){
  const seq=++screenDataSeq;
  document.getElementById('refreshHint').textContent='刷新中...';
  try{
    const [ov,paths,top,ev,geo]=await Promise.all([
      api('overview'), api('paths'), api('topn'), api('events'), api('geo')]);
    if(seq!==screenDataSeq) return;
    renderOverview(ov);
    pathsData=paths;
    geoData=geo;
    renderTopo(paths);
    refreshRotateState(false);
    renderTop(top);
    renderEvents(ev);
    noteDataError({overview:ov, paths:paths, topn:top, geo:geo});
    requestAnimationFrame(()=>markScrollable());
    document.getElementById('refreshHint').textContent=
      '更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
  }catch(e){
    if(seq!==screenDataSeq) return;
    document.getElementById('refreshHint').textContent='加载失败';
    document.getElementById('topoDetail').textContent='加载失败: '+e.message;
  }
}

function syncCenterPanelMode(){
  document.getElementById('centerPanel').classList.toggle('geo-mode',topoMode==='geo');
}

function clearTopoPending(){
  const el=document.getElementById('topoDetail');
  if(el&&el.parentElement) el.parentElement.classList.remove('topo-pending');
}

function setTopoMode(mode,btn){
  const prevMode=topoMode;
  topoMode=mode;
  document.getElementById('btnTopoGeo').classList.toggle('active',mode==='geo');
  document.getElementById('btnTopoSingle').classList.toggle('active',mode==='single');
  document.getElementById('btnTopoMerged').classList.toggle('active',mode==='merged');
  if(prevMode==='geo'&&mode!=='geo') geoRenderSeq++;
  syncCenterPanelMode();
  syncGlobeVisibility();
  if(mode==='geo'&&prevMode!=='geo') disposeGeoChart();
  if(pathsData||geoData) renderTopo(pathsData);
  syncAutoRotate();
  if(mode==='geo'){
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        if(!isGeoChartReady()) return;
        if(geoChart) geoChart.resize();
        else if(geoData) renderGeo(geoData,false);
      });
    });
  }
}

function toggleAutoRotate(btn){
  ROTATE.enabled=!ROTATE.enabled;
  btn.classList.toggle('active',ROTATE.enabled);
  syncAutoRotate();
}

function getRotatePool(paths){
  const list=paths||[];
  const reds=list.filter(p=>p.status==='red');
  if(reds.length) return {pool:reds, mode:'fault', label:'告警'};
  const oranges=list.filter(p=>p.status==='orange');
  if(oranges.length) return {pool:oranges, mode:'fault', label:'警告'};
  const normal=list.filter(p=>p.status!=='paused'&&p.status!=='gray');
  return {pool:normal.length?normal:list, mode:'normal', label:'正常'};
}

function mappableGeoTargets(geoData){
  return ((geoData&&geoData.targets)||[]).filter(t=>t.geo&&t.geo.lon!=null&&t.geo.lat!=null);
}

/** Geo rotation pool: when China map is locked, skip overseas targets not on the main map. */
function getGeoRotatePool(paths, geoData){
  const base=getRotatePool(paths||[]);
  if(topoMode!=='geo'||!geoData||geoMapUserChoice!=='china') return base;
  const mappable=mappableGeoTargets(geoData);
  const domesticIds=new Set(
    mappable.filter(t=>!isOverseasGeo(t.geo)).map(t=>t.tid)
  );
  const pool=base.pool.filter(p=>domesticIds.has(p.tid));
  if(pool.length>=ROTATE.minPaths) return {...base, pool};
  if(pool.length===1) return {...base, pool};
  return base;
}

function activeRotatePool(){
  return topoMode==='geo'
    ? getGeoRotatePool((pathsData&&pathsData.paths)||[], geoData)
    : getRotatePool((pathsData&&pathsData.paths)||[]);
}

/** Keep selectedTid pointing at a live target/path even when auto-rotate is off. */
function ensureSelectedTidValid(){
  if(topoMode==='geo'){
    const targets=(geoData&&geoData.targets)||[];
    if(!targets.length){ selectedTid=null; return; }
    if(!selectedTid||!targets.find(t=>t.tid===selectedTid)){
      const mappable=targets.filter(t=>t.geo&&t.geo.lon!=null&&t.geo.lat!=null);
      selectedTid=(mappable[0]||targets[0]||{}).tid||null;
    }
  } else if(topoMode==='single'){
    const paths=(pathsData&&pathsData.paths)||[];
    if(!paths.length){ selectedTid=null; return; }
    if(!selectedTid||!paths.find(p=>p.tid===selectedTid)){
      selectedTid=(paths[0]||{}).tid||null;
    }
  }
}

function poolKey(pool){return pool.map(p=>p.tid).join('|');}

function rotatePoolKeyInfo(poolInfo){
  return (poolInfo&&poolInfo.mode||'normal')+':'+poolKey((poolInfo&&poolInfo.pool)||[]);
}

function updateRotateBadge(poolInfo, idx){
  const el=document.getElementById('rotateBadge');
  const geoOk=topoMode==='geo';
  const singleOk=topoMode==='single';
  if(!ROTATE.enabled||(!geoOk&&!singleOk)||!poolInfo||poolInfo.pool.length<ROTATE.minPaths){
    el.classList.add('hidden');
    return;
  }
  const i=Math.max(0,Math.min(idx,poolInfo.pool.length-1));
  const cur=poolInfo.pool[i]||{};
  el.classList.remove('hidden');
  el.classList.toggle('fault',poolInfo.mode==='fault');
  const paused=Date.now()<rotatePausedUntil?' · 已暂停':'';
  const rawLabel=cur.label||cur.tid||'';
  const shortLabel=rawLabel.length>14?rawLabel.slice(0,13)+'…':rawLabel;
  el.title=rawLabel&&rawLabel.length>14?rawLabel:'';
  const tick=poolInfo.mode==='fault'?Math.round(ROTATE.faultMs/1000):Math.round(ROTATE.normalMs/1000);
  el.textContent=`${poolInfo.label} ${i+1}/${poolInfo.pool.length} · ${shortLabel}${paused} · ${tick}s`;
}

function stopRotateTimer(){
  clearInterval(rotateTimer);
  rotateTimer=null;
}

function startRotateTimer(poolInfo){
  stopRotateTimer();
  const ms=poolInfo.mode==='fault'?ROTATE.faultMs:ROTATE.normalMs;
  rotateTimer=setInterval(()=>{
    if(Date.now()<rotatePausedUntil){
      updateRotateBadge(poolInfo,rotateIdx);
      return;
    }
    const fresh=activeRotatePool();
    if(!fresh.pool.length) return;
    if(rotatePoolKeyInfo(fresh)!==rotatePoolKey){
      refreshRotateState(true);
      return;
    }
    rotateIdx=(rotateIdx+1)%fresh.pool.length;
    selectedTid=fresh.pool[rotateIdx].tid;
    if(topoMode==='geo') renderGeo(geoData,false);
    else renderSingleTopo(pathsData,false);
    updateRotateBadge(fresh,rotateIdx);
  },ms);
}

/** Update pool/badge; only restart the interval when ``restartTimer`` or pool changed. */
function refreshRotateState(restartTimer=false){
  ensureSelectedTidValid();
  const paths=(pathsData&&pathsData.paths)||[];
  const poolInfo=activeRotatePool();
  const geoOk=topoMode==='geo';
  const singleOk=topoMode==='single';
  if(!ROTATE.enabled||(!geoOk&&!singleOk)||poolInfo.pool.length<ROTATE.minPaths){
    stopRotateTimer();
    rotatePoolKey='';
    updateRotateBadge(null,0);
    return;
  }
  const key=rotatePoolKeyInfo(poolInfo);
  if(key!==rotatePoolKey){
    rotatePoolKey=key;
    rotateIdx=0;
    restartTimer=true;
  }else{
    rotateIdx=Math.max(0,poolInfo.pool.findIndex(p=>p.tid===selectedTid));
  }
  updateRotateBadge(poolInfo,rotateIdx);
  if(restartTimer||!rotateTimer){
    startRotateTimer(poolInfo);
  }
}

function syncAutoRotate(){
  refreshRotateState(true);
}

function pauseAutoRotate(ms){
  rotatePausedUntil=Date.now()+(ms||ROTATE.manualPauseMs);
}

function focusPath(tid,{pauseMs=0,render=true,focusMap=null}={}){
  if(!tid) return;
  selectedTid=tid;
  if(pauseMs) rotatePausedUntil=Date.now()+pauseMs;
  if(focusMap!==false&&(focusMap||pauseMs>0)){
    geoViewportMode='focus';
    geoViewportCache={key:'', mapMode:'', view:null};
    geoUserRoam=false;
    geoUserView=null;
  }
  const poolInfo=activeRotatePool();
  rotateIdx=Math.max(0,poolInfo.pool.findIndex(p=>p.tid===tid));
  if(render){
    if(topoMode==='geo'&&geoData) renderGeo(geoData,false);
    else if(pathsData) renderSingleTopo(pathsData,false);
  }
  updateRotateBadge(poolInfo,rotateIdx);
}

function drillToSinglePath(tid){
  if(!tid) return;
  focusPath(tid,{pauseMs:ROTATE.manualPauseMs,render:false});
  setTopoMode('single',document.getElementById('btnTopoSingle'));
  focusPath(tid,{pauseMs:ROTATE.manualPauseMs,render:true});
}

function onTraceFaultSSE(m){
  if(!m||!m.tid) return;
  if(topoMode==='geo'){
    focusPath(m.tid,{pauseMs:3000,render:true});
  } else if(topoMode==='single'){
    focusPath(m.tid,{pauseMs:3000,render:true});
  }
  syncAutoRotate();
}

function onTraceHealSSE(m){
  pauseAutoRotate(ROTATE.recoverDelayMs);
  flashRecoveryEvent(m);
  setTimeout(()=>syncAutoRotate(),ROTATE.recoverDelayMs+100);
}

function onRouteChangedSSE(m){
  if(!m||!m.tid) return;
  routeCompareByTid[m.tid]={
    diff:m.route_diff||{old_ips:m.old_ips||[],new_ips:m.new_ips||[],text:'路径变化'},
    until:Date.now()+45000,
  };
  focusPath(m.tid,{pauseMs:5000,render:true});
  syncAutoRotate();
}

/** Multi-dimensional posture radar — all axes derived from the overview
 *  payload already on hand (no extra request). Outer = healthier. */
function renderHealthRadar(ov){
  const svg=document.getElementById('healthRadar'); if(!svg) return;
  const c=ov.counts||{}; const tot=Math.max(c.targets||0,1);
  const risk=(ov.risk&&ov.risk.score!=null)?ov.risk.score:0;
  const health=(ov.health&&ov.health.score!=null)?ov.health.score:0;
  const up=(ov.avg_uptime_pct!=null)?ov.avg_uptime_pct:100;
  const clamp=v=>Math.max(0,Math.min(100,v));
  const dims=[
    ['连通率', (c.green||0)/tot*100],
    ['可用率', up],
    ['健康分', health*10],
    ['低风险', 100-risk],
    ['无故障', (1-(c.red||0)/tot)*100],
  ].map(d=>[d[0],clamp(d[1])]);
  const col=health>=8?'34,211,238':health>=6?'245,158,11':'239,68,68';
  const cx=160, cy=160, R=76, labelR=96, n=dims.length;
  const ang=i=>(-90+i*360/n)*Math.PI/180;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  const poly=(r,map)=>dims.map((_,i)=>pt(i,typeof r==='function'?r(i):r).map(v=>v.toFixed(1)).join(',')).join(' ');
  let g='<defs><filter id="radarGlow" x="-40%" y="-40%" width="180%" height="180%">'
    +'<feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/>'
    +'<feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  [0.25,0.5,0.75,1].forEach(f=>{
    g+=`<polygon points="${poly(R*f)}" fill="none" stroke="rgba(34,211,238,${f===1?0.22:0.08})" stroke-width="1"/>`;
  });
  dims.forEach((d,i)=>{
    const [ex,ey]=pt(i,R);
    g+=`<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="rgba(34,211,238,.13)"/>`;
    const [lx,ly]=pt(i,labelR);
    const anc=lx>cx+6?'start':(lx<cx-6?'end':'middle');
    g+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="var(--dim)" font-size="10.5" `
      +`text-anchor="${anc}" dominant-baseline="middle">${d[0]} `
      +`<tspan fill="rgb(${col})" font-weight="700">${Math.round(d[1])}</tspan></text>`;
  });
  g+=`<polygon points="${poly(i=>R*dims[i][1]/100)}" fill="rgba(${col},.20)" `
    +`stroke="rgb(${col})" stroke-width="2" stroke-linejoin="round" filter="url(#radarGlow)"/>`;
  dims.forEach((d,i)=>{const [px,py]=pt(i,R*d[1]/100);
    g+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="rgb(${col})"/>`;});
  svg.innerHTML=g;
}

/** Serpentine grid — every hop gets a slot; viewBox scales to row count. */
function layoutSerpentine(count, W, H, pad){
  // Short paths span a single full-width row (no wasted side margin); longer
  // paths wrap into a serpentine grid as before.
  const cols=count<=8?Math.max(1,count)
                     :Math.min(14, Math.max(6, Math.ceil(Math.sqrt(count*2.2))));
  const rows=Math.ceil(count/cols);
  const innerW=W-2*pad, innerH=H-2*pad;
  const cellW=innerW/cols, cellH=Math.max(72, innerH/rows);
  const totalH=pad*2+rows*cellH;
  // Node size scales with available cell room: larger when sparse (few hops),
  // smaller when dense (so a 2-hop path fills the panel and a 30-hop one fits).
  const scale=Math.max(0.92, Math.min(1.45, Math.min(cellW/130, cellH/132)));
  const pts=[];
  for(let i=0;i<count;i++){
    const row=Math.floor(i/cols);
    const colInRow=i%cols;
    const col=(row%2===0)?colInRow:(cols-1-colInRow);
    pts.push({x:pad+col*cellW+cellW/2, y:pad+row*cellH+cellH/2, row, col, idx:i});
  }
  return {pts, W, totalH:Math.max(H, totalH), cols, rows, cellW, cellH, scale};
}

function topoEdgePath(a, b){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const dx=b.x-a.x, dy=b.y-a.y;
  const cx=mx-dy*0.12, cy=my+dx*0.12;
  return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
}

/* One topology link. Healthy links: a calm gradient base line plus a single
   bright comet that travels source->target (clear direction, premium feel).
   Break/degraded links keep the coloured dashed flow — dash + colour carry the
   alarm, so they read as "down/uncertain" at a glance. */
function topoFlowEdge(a, b, hot, col, hotW, hotCls){
  const d=topoEdgePath(a, b);
  if(hot){
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${hotW}" opacity=".88" class="${hotCls}"/>`;
  }
  return `<path d="${d}" fill="none" stroke="url(#gradFlow)" stroke-width="2.4" class="edge-base"/>`+
         `<path d="${d}" fill="none" stroke="#dff4ff" stroke-width="2.8" stroke-dasharray="20 320" class="flow-comet"/>`;
}

/** Pick break/ICMP tag side — avoid covering neighbors and viewport edges. */
function pickTopoTagPlacement(pt, layout, r, tw, th, allPts){
  const gap=10;
  const margin=10;
  const labelBelow=r+34;
  const candidates=[
    {name:'top', rx:-tw/2, ry:-r-th-gap},
    {name:'bottom', rx:-tw/2, ry:labelBelow},
    {name:'left', rx:-r-tw-gap, ry:-th/2},
    {name:'right', rx:r+gap, ry:-th/2},
  ];
  const prev=pt.idx>0?allPts[pt.idx-1]:null;
  const next=pt.idx<allPts.length-1?allPts[pt.idx+1]:null;
  function score(c){
    const left=pt.x+c.rx, top=pt.y+c.ry, right=left+tw, bottom=top+th;
    let s=0;
    if(top<margin) s+=(margin-top)*4;
    if(left<margin) s+=(margin-left)*2;
    if(right>layout.W-margin) s+=(right-layout.W+margin)*2;
    if(bottom>layout.totalH-margin) s+=(bottom-layout.totalH+margin)*4;
    s+=Math.hypot((left+right)/2-pt.x, (top+bottom)/2-pt.y)*0.04;
    for(const op of allPts){
      if(op.idx===pt.idx) continue;
      const hitR=26;
      const cx=Math.max(left, Math.min(op.x, right));
      const cy=Math.max(top, Math.min(op.y, bottom));
      const d2=(op.x-cx)**2+(op.y-cy)**2;
      if(d2<(hitR+6)**2) s+=600;
      if(op.y<pt.y-12&&Math.abs(op.x-pt.x)<layout.cellW*0.85&&c.name==='top') s+=140;
      if(op.y>pt.y+12&&Math.abs(op.x-pt.x)<layout.cellW*0.85&&c.name==='bottom') s+=100;
      if(op.x<pt.x-12&&Math.abs(op.y-pt.y)<layout.cellH*0.6&&c.name==='left') s+=90;
      if(op.x>pt.x+12&&Math.abs(op.y-pt.y)<layout.cellH*0.6&&c.name==='right') s+=90;
    }
    if(prev){
      if(c.name==='top'&&prev.y<pt.y-10) s+=60;
      if(c.name==='left'&&prev.x<pt.x-10) s+=40;
      if(c.name==='right'&&prev.x>pt.x+10) s+=40;
    }
    if(next){
      if(c.name==='top'&&next.y<pt.y-10) s+=120;
      if(c.name==='bottom'&&next.y>pt.y+10) s+=25;
      if(c.name==='left'&&next.x<pt.x-10) s+=35;
      if(c.name==='right'&&next.x>pt.x+10) s+=35;
      if(next.y>pt.y+layout.cellH*0.35&&c.name==='top') s+=90;
    }
    if(prev&&next&&next.y>pt.y+layout.cellH*0.35){
      if(prev.x<pt.x-8&&c.name==='left') s+=45;
      if(prev.x>pt.x+8&&c.name==='right') s+=45;
      if(prev.x<pt.x-8&&c.name==='right') s-=25;
      if(prev.x>pt.x+8&&c.name==='left') s-=25;
    }
    return s;
  }
  let best=candidates[0], bestScore=Infinity;
  candidates.forEach(c=>{const sc=score(c); if(sc<bestScore){bestScore=sc; best=c;}});
  return best;
}

function renderHopNode(pt, meta, layout){
  const {x,y}=pt;
  const st=meta.status||'ok';
  const col=hopStatusColor(st);
  const isReal=meta.breakKind==='real';
  const isIcmpBlind=meta.breakKind==='icmp_filtered';
  const isEndpoint=meta.breakKind==='endpoint';
  const isHighlight=isReal||isIcmpBlind||isEndpoint||!!meta.breakPoint;
  const accent=isReal?'#ef4444':(isIcmpBlind?'#f59e0b':(isEndpoint?'#a78bfa':col));
  const pulse=(st==='break'||meta.pulse)?' class="pulse"':'';
  let r=meta.kind==='target'?26:(meta.kind==='source'?24:20);
  if(isReal||isIcmpBlind) r=32;
  else if(isEndpoint) r=28;
  else if(meta.kind==='target'&&meta.status==='red') r=28;
  const sc=(layout&&layout.scale)||1;
  r=Math.round(r*sc);
  const grad=meta.kind==='source'?'gradSource':(
    meta.kind==='target'?(meta.status==='red'?'gradBreak':'gradOk'):(
    isReal?'gradBreak':(
      isEndpoint?'gradEndpoint':(
      isIcmpBlind||st==='filtered'?'gradWarn':(
        st==='break'||st==='after'?'gradBreak':'gradOk')))));
  const glowFilter=isReal?'url(#breakGlow)':(isIcmpBlind?'url(#icmpGlow)':(isEndpoint?'url(#endpointGlow)':'url(#glow)'));
  const nodeCls=isReal?' class="break-node"':(isIcmpBlind?' class="icmp-blind-node"':(isEndpoint?' class="endpoint-node"':''));
  let g=`<g transform="translate(${x},${y})"${nodeCls}${pulse}>`;
  if(isReal){
    g+=`<circle r="${r+26}" fill="none" stroke="#ef4444" stroke-width="2" class="break-ripple"/>`;
    g+=`<circle r="${r+26}" fill="none" stroke="#ef4444" stroke-width="1.5" class="break-ripple" style="animation-delay:.75s"/>`;
    g+=`<circle r="${r+26}" fill="none" stroke="#ef4444" stroke-width="1" class="break-ripple" style="animation-delay:1.5s"/>`;
    g+=`<circle r="${r+10}" fill="none" stroke="#fca5a5" stroke-width="3" class="break-ring"/>`;
  } else if(isIcmpBlind){
    g+=`<circle r="${r+22}" fill="none" stroke="#f59e0b" stroke-width="2" class="icmp-ripple"/>`;
    g+=`<circle r="${r+22}" fill="none" stroke="#fbbf24" stroke-width="1.5" class="icmp-ripple" style="animation-delay:.9s"/>`;
    g+=`<circle r="${r+8}" fill="none" stroke="#fde68a" stroke-width="2.5" class="icmp-ring"/>`;
  }
  g+=`<circle r="${r+8}" fill="none" stroke="${accent}" stroke-width="${isHighlight?2:1}" opacity="${isHighlight?0.55:0.25}"/>`;
  g+=`<circle r="${r}" fill="url(#${grad})" stroke="${accent}" stroke-width="${isHighlight?3.5:2.5}" filter="${glowFilter}"/>`;
  let icon;
  if(meta.kind==='source'){
    // monitoring host — a small monitor/display glyph
    icon=`<rect x="-7" y="-6.5" width="14" height="9.5" rx="1.6" fill="none" stroke="#fff" stroke-width="1.5"/>`+
         `<line x1="0" y1="3" x2="0" y2="6" stroke="#fff" stroke-width="1.3"/>`+
         `<line x1="-4" y1="6.4" x2="4" y2="6.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`;
  } else if(meta.kind==='target'){
    icon=`<circle r="6.5" fill="none" stroke="#fff" stroke-width="1.6"/>`+
         `<circle r="2.4" fill="#fff"/>`;
  } else if(isReal){
    icon=`<path d="M0,-7 L7.2,5.6 L-7.2,5.6 Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>`+
         `<line x1="0" y1="-2.4" x2="0" y2="1.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>`+
         `<circle cy="4" r="1.05" fill="#fff"/>`;
  } else if(isIcmpBlind){
    icon=`<text y="3" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">ICMP</text>`;
  } else if(isEndpoint){
    icon=`<text y="3" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">APP</text>`;
  } else {
    // intermediate hop — router glyph (device + link dots) above the hop number
    icon=`<g transform="translate(0,-4.5)"><rect x="-6.5" y="-3.4" width="13" height="6.8" rx="1.6" fill="none" stroke="#fff" stroke-width="1.3"/>`+
         `<circle cx="-3.1" cy="0" r="0.85" fill="#fff"/><circle cx="0" cy="0" r="0.85" fill="#fff"/><circle cx="3.1" cy="0" r="0.85" fill="#fff"/></g>`+
         `<text y="10.5" text-anchor="middle" fill="#fff" font-size="9.5" font-weight="700">${meta.hopNum}</text>`;
  }
  g+=`<g transform="scale(${sc.toFixed(3)})">${icon}</g>`;
  const lbl=esc(meta.label||'');
  const short=lbl.length>18?(lbl.slice(0,8)+'…'+lbl.slice(-8)):lbl;
  const lblCol=isReal?'#fecaca':(isIcmpBlind?'#fde68a':(isEndpoint?'#ddd6fe':'#e2e8f0'));
  g+=`<text y="${r+18}" text-anchor="middle" fill="${lblCol}" font-size="${isHighlight?10.5:9.5}" font-weight="${isHighlight?700:400}">${short}</text>`;
  if(meta.rtt!=null && meta.kind==='hop'){
    g+=`<text y="${r+30}" text-anchor="middle" fill="#94a3b8" font-size="9">${meta.rtt} ms</text>`;
  }
  if(meta.tag){
    const tw=(isReal||isIcmpBlind)?(isIcmpBlind?92:88):(isEndpoint?96:56);
    const th=(isReal||isIcmpBlind||isEndpoint)?22:14;
    let tx=-tw/2, ty=-r-18;
    if(isHighlight&&layout){
      const pick=pickTopoTagPlacement(pt, layout, r, tw, th, layout.pts);
      tx=pick.rx; ty=pick.ry;
    } else if(isHighlight){
      ty=-r-th-10;
    }
    const tagCls=isReal?'break-tag-bg':(isIcmpBlind?'icmp-tag-bg':(isEndpoint?'endpoint-tag-bg':''));
    const tagFill=isReal?'rgba(239,68,68,.35)':(isIcmpBlind?'rgba(245,158,11,.35)':(isEndpoint?'rgba(167,139,250,.28)':col));
    const tagStroke=isReal?'#ef4444':(isIcmpBlind?'#f59e0b':(isEndpoint?'#a78bfa':'none'));
    const tagIcon=isReal?'△ ':((isIcmpBlind&&meta.tag.indexOf('ICMP')<0)?'◈ ':((isEndpoint)?'◆ ':''));
    g+=`<rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="5" class="${tagCls}" fill="${tagFill}" opacity="${isHighlight?1:.25}" stroke="${tagStroke}"/>`;
    g+=`<text x="${tx+tw/2}" y="${ty + th / 2}" dominant-baseline="middle" text-anchor="middle" fill="${isHighlight?'#fff':col}" font-size="${isHighlight?10:8.5}" font-weight="700">${tagIcon}${esc(meta.tag)}</text>`;
  }
  if(lbl) g+=`<title>${lbl}${meta.rtt!=null?' · '+meta.rtt+' ms':''}${meta.tag?' · '+meta.tag:''}</title>`;
  g+='</g>';
  return g;
}

/* 3D country polygons: subtle fill + raised altitude reduces z-fighting / border shimmer. */
const GLOBE_POLY_ALT_BASE=0.012, GLOBE_POLY_ALT_HOVER=0.022;
const GLOBE_HOVER_ROTATE_DELAY_MS=5000;
function globePolyCapColor(isHover){
  if(isHover) return 'rgba(56,224,255,0.24)';
  if(globeStyle==='real') return 'rgba(186,210,235,0.028)';
  return 'rgba(56,224,255,0.045)';
}
function globePolySideColor(){
  if(globeStyle==='real') return 'rgba(0,0,0,0)';
  return 'rgba(56,224,255,0.07)';
}
function globePolyStrokeColor(){
  if(globeStyle==='real') return 'rgba(0,0,0,0)';
  return 'rgba(56,224,255,0.30)';
}
function globePolyAltitude(d){ return d===globeHoverPoly?GLOBE_POLY_ALT_HOVER:GLOBE_POLY_ALT_BASE; }
function applyGlobePolygonStyle(){
  if(!globe) return;
  globe.polygonCapColor(d=>globePolyCapColor(d===globeHoverPoly))
       .polygonSideColor(()=>globePolySideColor())
       .polygonStrokeColor(()=>globePolyStrokeColor())
       .polygonAltitude(globePolyAltitude);
}

function collectGeoPoints(targets, src){
  const pts=[];
  (targets||[]).forEach(t=>{
    if(t.geo&&t.geo.lon!=null&&t.geo.lat!=null) pts.push([t.geo.lon, t.geo.lat]);
    if(t.break_geo&&t.break_geo.lon!=null) pts.push([t.break_geo.lon, t.break_geo.lat]);
  });
  if(src&&src.lon!=null&&src.lat!=null) pts.push([src.lon, src.lat]);
  return pts;
}

/** Viewport fit uses target + monitor-source pins only — break hops must not
 *  zoom the map in/out when tracert data arrives on refresh.
 *  Domestic focus: target + source (both fit in China).  Overseas focus: target
 *  only — source still draws arcs but must not pull the center to Africa/Med. */
function collectGeoFocusPoints(targets, src, focusTid){
  const pts=[];
  const row=(targets||[]).find(t=>t.tid===focusTid);
  const g=row&&row.geo;
  if(g&&g.lon!=null&&g.lat!=null){
    pts.push([g.lon, g.lat]);
    if(!isOverseasGeo(g)&&src&&src.lon!=null&&src.lat!=null){
      pts.push([src.lon, src.lat]);
    }
  }else if(src&&src.lon!=null&&src.lat!=null){
    pts.push([src.lon, src.lat]);
  }
  return pts;
}

/** Faint lat/lon graticule (curves with the map projection) as polylines. */
function buildGraticule(mapMode){
  const W=mapMode==='world';
  const lonMin=W?-180:70, lonMax=W?180:140, lonStep=W?30:10;
  const latMin=W?-60:10,  latMax=W?80:55,   latStep=W?20:10;
  const out=[];
  for(let lon=lonMin; lon<=lonMax+0.001; lon+=lonStep){
    const pts=[]; for(let lat=latMin; lat<=latMax; lat+=3) pts.push([lon,lat]);
    pts.push([lon,latMax]); out.push({coords:pts});
  }
  for(let lat=latMin; lat<=latMax+0.001; lat+=latStep){
    const pts=[]; for(let lon=lonMin; lon<=lonMax; lon+=3) pts.push([lon,lat]);
    pts.push([lonMax,lat]); out.push({coords:pts});
  }
  return out;
}

function geoViewportKey(mapMode, mode, focusTid, pts){
  if(geoUserRoam) return mapMode+'|roam';

  const sig=(pts||[]).map(([lon,lat])=>lon.toFixed(2)+','+lat.toFixed(2)).sort().join(';');
  return mapMode+'|focus|'+focusTid+'|'+sig;
}

function collectGeoViewportPoints(targets, src){

  (targets||[]).forEach(t=>{
    if(t.geo&&t.geo.lon!=null&&t.geo.lat!=null) pts.push([t.geo.lon, t.geo.lat]);

  return pts;
}

function pointInChina(lon, lat){
  return lon>=CHINA_BBOX.minLon&&lon<=CHINA_BBOX.maxLon&&lat>=CHINA_BBOX.minLat&&lat<=CHINA_BBOX.maxLat;
}

function isOverseasGeo(g){
  return !!(g&&g.lon!=null&&g.lat!=null&&!pointInChina(g.lon,g.lat));
}

function suggestGeoMapMode(targets, src){
  const pts=collectGeoPoints(targets, src);
  if(!pts.length) return 'china';
  return pts.some(([lon,lat])=>!pointInChina(lon, lat))?'world':'china';
}

function resolveGeoMapMode(targets, src, tid){
  if(geoMapUserChoice) return geoMapUserChoice;
  if(tid){
    const cur=(targets||[]).find(t=>t.tid===tid);
    if(cur&&cur.geo) return isOverseasGeo(cur.geo)?'world':'china';
  }
  return suggestGeoMapMode(targets, src);
}

function computeGeoFocusViewport(pts, mapMode){
  const pad=mapMode==='china'?6:10;
  if(!pts.length){
    return mapMode==='china'?chinaOverviewViewport():worldOverviewViewport();
  }
  let minLon=180,maxLon=-180,minLat=90,maxLat=-90;
  pts.forEach(([lon,lat])=>{
    minLon=Math.min(minLon,lon); maxLon=Math.max(maxLon,lon);
    minLat=Math.min(minLat,lat); maxLat=Math.max(maxLat,lat);
  });
  minLon-=pad; maxLon+=pad; minLat-=pad; maxLat+=pad;
  if(mapMode==='china'){
    minLon=Math.max(CHINA_BBOX.minLon,minLon); maxLon=Math.min(CHINA_BBOX.maxLon,maxLon);
    minLat=Math.max(CHINA_BBOX.minLat,minLat); maxLat=Math.min(CHINA_BBOX.maxLat,maxLat);
    const minLonSpan=10, minLatSpan=8;
    const cLon=(minLon+maxLon)/2, cLat=(minLat+maxLat)/2;
    if(maxLon-minLon<minLonSpan){
      const half=minLonSpan/2;
      minLon=cLon-half; maxLon=cLon+half;
    }
    if(maxLat-minLat<minLatSpan){
      const half=minLatSpan/2;
      minLat=cLat-half; maxLat=cLat+half;
    }
    minLon=Math.max(CHINA_BBOX.minLon,minLon); maxLon=Math.min(CHINA_BBOX.maxLon,maxLon);
    minLat=Math.max(CHINA_BBOX.minLat,minLat); maxLat=Math.min(CHINA_BBOX.maxLat,maxLat);
  } else {
    minLon=Math.max(WORLD_BBOX.minLon,minLon); maxLon=Math.min(WORLD_BBOX.maxLon,maxLon);
    minLat=Math.max(WORLD_BBOX.minLat,minLat); maxLat=Math.min(WORLD_BBOX.maxLat,maxLat);
  }
  const center=[(minLon+maxLon)/2,(minLat+maxLat)/2];
  const lonSpan=maxLon-minLon;
  const latSpan=maxLat-minLat;
  const span=Math.max(lonSpan, latSpan*1.35, mapMode==='china'?12:40);
  let zoom, aspectScale;
  if(mapMode==='china'){
    zoom=Math.max(0.88, Math.min(1.45, 24/span));
    aspectScale=0.82;
  } else {
    zoom=Math.min(2.0, (108/span)*0.96);
    zoom=Math.max(lonSpan>100?0.78:0.92, zoom);
    aspectScale=0.75;
  }
  const out={center, zoom, aspectScale};
  if(mapMode==='china') out.boundingCoords=[[minLon,maxLat],[maxLon,minLat]];
  return out;
}

function resolveGeoViewport(viewPts, mapMode, mode, focusTid, onMap, src){
  if(mode==='overview'){
    return mapMode==='china'?chinaOverviewViewport():worldOverviewViewport();
  }
  const focusPts=collectGeoFocusPoints(onMap, src, focusTid);
  return computeGeoFocusViewport(focusPts.length?focusPts:viewPts, mapMode);
}

function geoPlaceLabel(g){
  if(!g) return '';
  const city=cnPlace(g.city);
  const region=cnPlace(g.region);
  const country=cnPlace(g.country);
  const parts=[];
  if(city) parts.push(city);
  if(region&&region!==city) parts.push(region);
  if(country&&country!==city&&country!==region) parts.push(country);
  if(parts.length) return parts.join(' · ');
  const raw=[g.city,g.region,g.country].filter(x=>{
    const t=String(x||'').trim();
    return t&&t!=='0';
  });
  return raw.length?raw.join(' · '):'';
}

/** Monitor-source pin label: manual geo keeps user label; auto uses geoPlaceLabel. */
function monitorSourceLabel(src){
  if(!src) return '监控主机';
  if(src.loc_source==='manual'){
    const custom=String(src.label||'').trim();
    if(custom) return custom;
  }
  const place=geoPlaceLabel(src);
  return place?('监控主机 · '+place):'监控主机';
}

function geoScatterLabelPos(lon, lat, center){
  const dLon=lon-center[0], dLat=lat-center[1];
  if(Math.abs(dLon)>=Math.abs(dLat)){
    return dLon>=0
      ? {position:'right', align:'left', verticalAlign:'middle'}
      : {position:'left', align:'right', verticalAlign:'middle'};
  }
  return dLat>=0
    ? {position:'top', align:'center', verticalAlign:'bottom'}
    : {position:'bottom', align:'center', verticalAlign:'top'};
}

function renderGeoInset(data, extra, hiTid){
  const inset=[...(data&&data.inset)||[], ...(extra||[])];
  const wrap=document.getElementById('geoInset');
  const grid=document.getElementById('geoInsetGrid');
  wrap.classList.toggle('has-inset',inset.length>0);
  if(!inset.length){
    grid.innerHTML='';
    return;
  }
  grid.innerHTML=inset.map(it=>{
    const kind=it.inset_kind||'private';
    const hint=kind==='unlocated'?' · 未定位':(kind==='overseas'?' · 境外 · 点「世界」查看':'');
    const cls=kind==='unlocated'?'unlocated':(kind==='overseas'?'overseas':'');
    const isSel=hiTid&&it.tid===hiTid;
    const click=kind==='overseas'
      ? `onclick="focusPath('${escAttr(it.tid||'')}',{pauseMs:${ROTATE.manualPauseMs}})"`
      : `onclick="drillToSinglePath('${escAttr(it.tid||'')}')"`;
    const title=kind==='overseas'?'境外目标在中国地图上不显示，点击高亮': '点击查看跳级拓扑';
    return `<span class="geo-inset-chip ${esc(it.status||'')} ${cls}${isSel?' active':''}" data-tid="${escAttr(it.tid||'')}" `+
      `${click} title="${title}">`+
      `${esc(it.label||it.tid||'')}${hint}${it.break_label?' · '+esc(it.break_label):''}</span>`;
  }).join('');
}

    requestAnimationFrame(()=>markScrollable(document.getElementById('topoDetail')));
    if(updateBadge){
      const poolInfo=activeRotatePool();
