<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络链路态势大屏</title>
<style>
:root{
  --bg:#050b18;--panel:#0a1628;--border:#1e3a5f;--text:#e2e8f0;--dim:#94a3b8;
  --cyan:#22d3ee;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;--purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei",sans-serif}
#stage{width:1920px;height:1080px;transform-origin:0 0;position:absolute;background:
  radial-gradient(ellipse at 50% 0%,rgba(34,211,238,.08),transparent 55%),
  linear-gradient(180deg,#050b18 0%,#0a1020 100%)}
.grid{display:grid;grid-template-columns:420px 1fr 420px;grid-template-rows:72px 1fr 220px;
  gap:12px;padding:12px;height:100%}
.panel{background:rgba(10,22,40,.82);border:1px solid var(--border);border-radius:10px;
  position:relative;overflow:hidden;box-shadow:0 0 24px rgba(34,211,238,.06) inset}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--cyan);opacity:.45}
.panel::before{top:6px;left:6px;border-right:none;border-bottom:none}
.panel::after{bottom:6px;right:6px;border-left:none;border-top:none}
.ptitle{font-size:13px;font-weight:700;color:var(--cyan);letter-spacing:.08em;padding:12px 14px 8px;
  border-bottom:1px solid rgba(30,58,95,.6)}
.pbody{padding:12px 14px;height:calc(100% - 42px);overflow:auto}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.topbar h1{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.06em}
.topmeta{font-size:12px;color:var(--dim);display:flex;gap:18px;align-items:center}
.btn{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);color:var(--cyan);
  padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;text-decoration:none}
.btn:hover{background:rgba(34,211,238,.22)}
.winbtn{padding:4px 10px;margin-left:4px;border-radius:4px;border:1px solid var(--border);
  background:transparent;color:var(--dim);cursor:pointer;font-size:11px}
.winbtn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.1)}
.gauge{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;border:3px solid var(--cyan);box-shadow:0 0 18px rgba(34,211,238,.25)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(15,23,42,.6);border:1px solid rgba(30,58,95,.5);border-radius:8px;padding:10px}
.stat .k{font-size:11px;color:var(--dim)} .stat .v{font-size:20px;font-weight:700;margin-top:4px}
.v.green{color:var(--green)} .v.orange{color:var(--orange)} .v.red{color:var(--red)}
.center{grid-row:2;grid-column:2;display:flex;flex-direction:column;min-height:0}
#topoSvg{width:100%;flex:1;min-height:0;background:rgba(5,11,24,.5);border-radius:8px;
  display:block}
.topo-detail{margin-top:8px;font-size:12px;color:var(--dim);min-height:36px;padding:8px 10px;
  background:rgba(15,23,42,.55);border-radius:8px;border:1px solid rgba(30,58,95,.4)}
.toplist{display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;
  border-bottom:1px dashed rgba(30,58,95,.4)}
.timeline{grid-column:1/-1}
.tline{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto}
.trow{display:grid;grid-template-columns:72px 120px 1fr;gap:10px;font-size:12px;padding:6px 8px;
  border-radius:6px;background:rgba(15,23,42,.45);animation:fadeIn .4s ease}
.trow.red{border-left:3px solid var(--red)} .trow.orange{border-left:3px solid var(--orange)}
.trow.green{border-left:3px solid var(--green)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.flow{stroke-dasharray:8 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.hidden{display:none}
</style>
</head>
<body>
<div id="stage">
<div class="grid">
  <div class="topbar panel" style="border-radius:10px">
    <div>
      <h1>网络链路态势大屏</h1>
      <div class="topmeta" style="margin-top:6px">
        <span id="clock">--</span>
        <span id="refreshHint">加载中...</span>
        <span id="countsHint">--</span>
      </div>
    </div>
    <div>
      <button class="winbtn active" data-w="today" onclick="setWindow('today',this)">今日</button>
      <button class="winbtn" data-w="1h" onclick="setWindow('1h',this)">近1小时</button>
      <button class="winbtn" data-w="7d" onclick="setWindow('7d',this)">近7天</button>
      <a class="btn" href="/" style="margin-left:10px">返回控制台</a>
      <button class="btn" onclick="toggleFs()" style="margin-left:6px">全屏</button>
    </div>
  </div>

  <div class="panel" style="grid-row:2">
    <div class="ptitle">网络风险状况</div>
    <div class="pbody">
      <div class="gauge">
        <div class="ring" id="riskRing">--</div>
        <div><div style="font-size:11px;color:var(--dim)">风险指数</div>
          <div id="riskGrade" style="font-size:16px;font-weight:700;margin-top:4px">--</div></div>
      </div>
      <div class="statgrid" id="riskStats"></div>
    </div>
  </div>

  <div class="panel center">
    <div class="ptitle">动态链路拓扑</div>
    <div class="pbody" style="display:flex;flex-direction:column;height:calc(100% - 42px)">
      <svg id="topoSvg" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="topo-detail" id="topoDetail">选择节点或等待路径数据...</div>
    </div>
  </div>

  <div class="panel" style="grid-row:2">
    <div class="ptitle">网络健康 · TOP</div>
    <div class="pbody">
      <div class="gauge">
        <div class="ring" id="healthRing" style="border-color:var(--green);box-shadow:0 0 18px rgba(34,197,94,.25)">--</div>
        <div><div style="font-size:11px;color:var(--dim)">健康评分</div>
          <div id="healthGrade" style="font-size:16px;font-weight:700;margin-top:4px">--</div></div>
      </div>
      <div class="ptitle" style="padding:8px 0;font-size:11px">SLA 最低 TOP5</div>
      <div class="toplist" id="topSla"></div>
      <div class="ptitle" style="padding:8px 0;font-size:11px">P95 最高 TOP5</div>
      <div class="toplist" id="topLat"></div>
    </div>
  </div>

  <div class="panel timeline">
    <div class="ptitle">重点事件时间线</div>
    <div class="pbody"><div class="tline" id="eventLine"></div></div>
  </div>
</div>
</div>
<script>
const DEMO=new URLSearchParams(location.search).get('demo')==='1';
let WINDOW='today';
let pathsData=null;
let selectedTid=null;
let refreshTimer=null;

function fitStage(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  const el=document.getElementById('stage');
  el.style.transform='scale('+s+')';
  el.style.left=((innerWidth-1920*s)/2)+'px';
  el.style.top=((innerHeight-1080*s)/2)+'px';
}
addEventListener('resize',fitStage); fitStage();

function tickClock(){
  document.getElementById('clock').textContent=
    new Date().toLocaleString('zh-CN',{hour12:false});
}
setInterval(tickClock,1000); tickClock();

function setWindow(w,btn){
  WINDOW=w;
  document.querySelectorAll('.winbtn').forEach(b=>b.classList.toggle('active',b===btn));
  loadAll();
}

function api(path){
  const q=DEMO?'&demo=1':'';
  return fetch('/api/screen/'+path+'?window='+encodeURIComponent(WINDOW)+q)
    .then(r=>r.json());
}

async function loadAll(){
  document.getElementById('refreshHint').textContent='刷新中...';
  try{
    const [ov,paths,top,ev]=await Promise.all([
      api('overview'), api('paths'), api('topn'), api('events')]);
    renderOverview(ov);
    pathsData=paths;
    renderTopo(paths);
    renderTop(top);
    renderEvents(ev);
    document.getElementById('refreshHint').textContent=
      '更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
  }catch(e){
    document.getElementById('refreshHint').textContent='加载失败';
    document.getElementById('topoDetail').textContent='加载失败: '+e.message;
  }
}

function renderOverview(ov){
  const c=ov.counts||{};
  document.getElementById('riskRing').textContent=(ov.risk&&ov.risk.score!=null)?ov.risk.score:'--';
  document.getElementById('riskGrade').textContent=(ov.risk&&ov.risk.grade)||'--';
  document.getElementById('healthRing').textContent=(ov.health&&ov.health.score!=null)?ov.health.score:'--';
  document.getElementById('healthGrade').textContent=(ov.health&&ov.health.grade)||'--';
  document.getElementById('countsHint').textContent=
    `节点 ${c.targets||0} · 正常 ${c.green||0} · 告警 ${c.red||0} · 未恢复 ${ov.open_incidents||0}`;
  document.getElementById('riskStats').innerHTML=[
    ['正常','green',c.green],['警告','orange',c.orange],['告警','red',c.red],
    ['Webhook失败','orange',ov.webhook_failures||0]
  ].map(([k,cls,v])=>`<div class="stat"><div class="k">${k}</div><div class="v ${cls}">${v||0}</div></div>`).join('');
}

function colorForStatus(st){
  if(st==='red')return '#ef4444';
  if(st==='orange')return '#f59e0b';
  if(st==='green')return '#22c55e';
  return '#64748b';
}

function hopStatusColor(st){
  if(st==='red'||st==='break'||st==='after') return '#ef4444';
  if(st==='orange'||st==='filtered') return '#f59e0b';
  if(st==='green'||st==='ok') return '#22d3ee';
  return '#64748b';
}

function hopLabel(h){
  const ip=(h.ip||'').trim();
  if(ip && ip!=='*') return ip;
  if(h.status==='filtered') return 'ICMP过滤';
  if(h.status==='break'||h.status==='after') return '无响应';
  return '未知';
}

/** Serpentine grid — every hop gets a slot; viewBox scales to row count. */
function layoutSerpentine(count, W, H, pad){
  const cols=Math.min(14, Math.max(6, Math.ceil(Math.sqrt(count*2.2))));
  const rows=Math.ceil(count/cols);
  const innerW=W-2*pad, innerH=H-2*pad;
  const cellW=innerW/cols, cellH=Math.max(72, innerH/rows);
  const totalH=pad*2+rows*cellH;
  const pts=[];
  for(let i=0;i<count;i++){
    const row=Math.floor(i/cols);
    const colInRow=i%cols;
    const col=(row%2===0)?colInRow:(cols-1-colInRow);
    pts.push({x:pad+col*cellW+cellW/2, y:pad+row*cellH+cellH/2, row, col, idx:i});
  }
  return {pts, W, totalH:Math.max(H, totalH), cols, rows, cellW, cellH};
}

function topoEdgePath(a, b){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const dx=b.x-a.x, dy=b.y-a.y;
  const cx=mx-dy*0.12, cy=my+dx*0.12;
  return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
}

function renderHopNode(pt, meta){
  const {x,y}=pt;
  const st=meta.status||'ok';
  const col=hopStatusColor(st);
  const pulse=(st==='break'||meta.pulse)?' class="pulse"':'';
  const r=meta.kind==='target'?26:(meta.kind==='source'?24:20);
  const grad=meta.kind==='source'?'gradSource':(
    meta.kind==='target'?(meta.status==='red'?'gradBreak':'gradOk'):(
    st==='break'||st==='after'?'gradBreak':(
      st==='filtered'?'gradWarn':'gradOk')));
  let g=`<g transform="translate(${x},${y})"${pulse}>`;
  g+=`<circle r="${r+8}" fill="none" stroke="${col}" stroke-width="1" opacity=".25"/>`;
  g+=`<circle r="${r}" fill="url(#${grad})" stroke="${col}" stroke-width="2.5" filter="url(#glow)"/>`;
  if(meta.kind==='source'){
    g+=`<text y="5" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">源</text>`;
  } else if(meta.kind==='target'){
    g+=`<text y="4" text-anchor="middle" fill="#fff" font-size="14">🎯</text>`;
  } else {
    g+=`<text y="-2" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">${meta.hopNum}</text>`;
  }
  const lbl=esc(meta.label||'');
  const short=lbl.length>18?(lbl.slice(0,8)+'…'+lbl.slice(-8)):lbl;
  g+=`<text y="${r+16}" text-anchor="middle" fill="#e2e8f0" font-size="9.5">${short}</text>`;
  if(meta.rtt!=null && meta.kind==='hop'){
    g+=`<text y="${r+28}" text-anchor="middle" fill="#94a3b8" font-size="9">${meta.rtt} ms</text>`;
  }
  if(meta.tag){
    g+=`<rect x="-28" y="${-r-18}" width="56" height="14" rx="4" fill="${col}" opacity=".25"/>`;
    g+=`<text y="${-r-8}" text-anchor="middle" fill="${col}" font-size="8.5" font-weight="600">${esc(meta.tag)}</text>`;
  }
  if(lbl) g+=`<title>${lbl}${meta.rtt!=null?' · '+meta.rtt+' ms':''}</title>`;
  g+='</g>';
  return g;
}

function renderTopo(data){
  const svg=document.getElementById('topoSvg');
  const paths=(data&&data.paths)||[];
  if(!paths.length){
    svg.setAttribute('viewBox','0 0 920 480');
    svg.innerHTML='<text x="460" y="240" fill="#64748b" text-anchor="middle" font-size="14">暂无路径数据</text>';
    return;
  }
  if(!selectedTid||!paths.find(p=>p.tid===selectedTid)) selectedTid=paths[0].tid;
  const p=paths.find(x=>x.tid===selectedTid)||paths[0];
  const hops=p.hops||[];
  const summary=p.summary||{};
  const breakHop=(summary.break_at&&summary.break_at.hop)||null;

  const nodes=[];
  nodes.push({kind:'source', status:'ok', label:'监控主机', hopNum:0});
  hops.forEach(h=>{
    const st=h.status||'ok';
    let tag='';
    if(h.hop===breakHop) tag='疑似断点';
    else if(st==='filtered') tag='ICMP过滤';
    else if(st==='break') tag='无响应';
    nodes.push({
      kind:'hop', status:st, hopNum:h.hop||'?',
      label:hopLabel(h),
      rtt:h.rtt_ms!=null?Number(h.rtt_ms).toFixed(1):null,
      tag, pulse:h.hop===breakHop,
    });
  });
  nodes.push({
    kind:'target', status:p.status||'green', pulse:p.status==='red',
    label:(p.label||'目标')+' · '+(p.ip||''),
  });

  const layout=layoutSerpentine(nodes.length, 920, 480, 36);
  svg.setAttribute('viewBox',`0 0 ${layout.W} ${layout.totalH}`);

  let html=`<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gradSource" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gradOk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gradWarn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradBreak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(30,58,95,.35)" stroke-width="1"/>
    </pattern>
  </defs>`;
  html+=`<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>`;
  html+=`<rect x="12" y="8" width="160" height="28" rx="6" fill="rgba(15,23,42,.75)" stroke="rgba(34,211,238,.3)"/>`;
  html+=`<text x="24" y="27" fill="#22d3ee" font-size="12" font-weight="600">共 ${hops.length} 跳 · ${esc(p.label||'')}</text>`;

  for(let i=0;i<layout.pts.length-1;i++){
    const a=layout.pts[i], b=layout.pts[i+1];
    const st=nodes[i+1].status||'ok';
    const col=hopStatusColor(st);
    const dash=(st==='break'||st==='after')?' stroke-dasharray="6 4"':'';
    html+=`<path d="${topoEdgePath(a,b)}" fill="none" stroke="${col}" stroke-width="2.5" opacity=".75"${dash} class="flow"/>`;
    html+=`<circle cx="${(a.x+b.x)/2}" cy="${(a.y+b.y)/2}" r="2.5" fill="${col}" opacity=".9"/>`;
  }

  layout.pts.forEach((pt,i)=>{
    html+=renderHopNode(pt, nodes[i]);
  });

  svg.innerHTML=html;
  const tabs=paths.map(pp=>`<button class="winbtn${pp.tid===selectedTid?' active':''}" style="margin:0 4px 8px 0" onclick="selectPath('${escAttr(pp.tid)}')">${esc(pp.label)}</button>`).join('');
  const detail=(summary.text||'路径完整')+
    (p.trace_status==='pending'?' · 追踪进行中（读缓存，不强制刷新）':'');
  document.getElementById('topoDetail').innerHTML=tabs+
    `<div style="margin-top:6px">${esc(detail)}</div>`+
    `<div style="margin-top:4px;font-size:11px;color:var(--dim)">可视化 ${nodes.length} 个节点（含源/目标），与 traceroute ${hops.length} 跳一致</div>`;
}

function selectPath(tid){selectedTid=tid; renderTopo(pathsData);}

function renderTop(top){
  const sla=(top.lowest_sla||[]).slice(0,5);
  const lat=(top.highest_latency||[]).slice(0,5);
  document.getElementById('topSla').innerHTML=sla.length?sla.map(r=>
    `<div class="toprow"><span>${esc(r.label)}</span><span>${r.uptime_pct!=null?r.uptime_pct.toFixed(3)+'%':'--'}</span></div>`).join('')
    :'<div style="color:var(--dim);font-size:12px">暂无</div>';
  document.getElementById('topLat').innerHTML=lat.length?lat.map(r=>
    `<div class="toprow"><span>${esc(r.label)}</span><span>${r.lat_p95!=null?r.lat_p95+' ms':(r.lat_avg!=null?r.lat_avg+' ms':'--')}</span></div>`).join('')
    :'<div style="color:var(--dim);font-size:12px">暂无</div>';
}

function renderEvents(ev){
  const rows=(ev&&ev.events)||ev||[];
  document.getElementById('eventLine').innerHTML=rows.length?rows.map(r=>{
    const cls=r.level==='red'?'red':(r.level==='orange'?'orange':'green');
    return `<div class="trow ${cls}"><span>${esc(r.time||'--')}</span><span>${esc(r.label||'')}</span><span>${esc(r.text||'')}</span></div>`;
  }).join(''):'<div style="color:var(--dim);font-size:12px">暂无事件</div>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function escAttr(s){return esc(s).replace(/'/g,'&#39;');}

function toggleFs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

function connectSSE(){
  if(DEMO) return;
  const es=new EventSource('/events');
  let deb=null;
  es.onmessage=e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.type==='heartbeat') return;
      clearTimeout(deb);
      deb=setTimeout(loadAll,1200);
    }catch(_){}
  };
  es.onerror=()=>{es.close(); setTimeout(connectSSE,5000);};
}
connectSSE();
loadAll();
refreshTimer=setInterval(loadAll,15000);
</script>
</body>
</html>
